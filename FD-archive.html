<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아카이브 - JAEHO ERP Suite</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabaseClient.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            /* 대시보드(menu.html)와 동일한 헤더/콘텐츠 변수 — 테마 선택 시 이 페이지도 같이 바뀝니다 */
            --header-bg:#ffffff; --header-text:#16324f; --header-border:#16324f; --header-border-width:2px;
            --header-btn-border:#d7dee4; --header-btn-hover-bg:#f2f5f7; --logo-bg:#16324f; --logo-text:#ffffff;
            --content-bg:#ffffff; --card-bg:#ffffff; --text:#1f2328; --text-secondary:#6b7280; --text-tertiary:#9ca3af;
            --border:#e8eaed; --primary: var(--logo-bg);
            --success:#10b981; --success-soft:#ecfdf5; --warning:#f59e0b; --warning-soft:#fffbeb;
            --info:#3b82f6; --info-soft:#eff6ff; --danger:#ef4444; --danger-soft:#fef2f2;
            --gray-100:#f8f9fa; --gray-200:#eceef0; --gray-300:#dfe3e7;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.06);
        }
        body { font-family: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--content-bg); color: var(--text); }
        a { color: inherit; }

        /* ===== Header — 대시보드와 동일한 구조 (테마 색상 실시간 반영) ===== */
        header{
            height:56px; background:var(--header-bg); color:var(--header-text);
            border-bottom:var(--header-border-width) solid var(--header-border);
            display:flex; align-items:center; justify-content:space-between; padding:0 24px;
            transition:background .2s,color .2s,border-color .2s;
        }
        .brand{display:flex;align-items:center;gap:10px;}
        .brand-logo{width:28px;height:28px;background:var(--logo-bg);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--logo-text);font-weight:700;font-size:13px;flex-shrink:0;}
        .brand-info{display:flex;flex-direction:column;line-height:1.25;}
        .brand-title{font-size:14px;font-weight:600;color:var(--header-text);}
        .brand-sub{font-size:11px;color:var(--header-text);opacity:0.65;}
        .hbtns{display:flex;gap:8px;flex-wrap:wrap;}
        .ghost-btn{
            background:transparent;border:1px solid var(--header-btn-border);color:var(--header-text);
            padding:6px 12px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;
            text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;
        }
        .ghost-btn:hover{background:var(--header-btn-hover-bg);}

        .content { width: 100%; padding: 30px; background: var(--content-bg); overflow-y: auto; }
        .page-header { margin-bottom: 30px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: var(--text-secondary); }

        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; font-family: inherit; display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: var(--gray-100); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: var(--danger-soft); color: var(--danger); }
        .btn-small { padding: 7px 11px; font-size: 11px; min-height: 32px; }

        .card { background: var(--card-bg); border-radius: 10px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { background: var(--gray-100); border-top: 1px solid var(--border); border-bottom: 2px solid var(--border); }
        th { padding: 12px 16px; text-align: left; font-weight: 600; text-transform: uppercase; font-size: 11px; color: var(--text-secondary); white-space:nowrap; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
        tbody tr:hover { background: var(--gray-100); }
        .doc-title { font-weight: 600; color: var(--text); cursor: pointer; }
        .doc-title:hover { color: var(--primary); text-decoration: underline; }
        .doc-desc { font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; }
        .meta { color: var(--text-secondary); white-space: nowrap; }
        .row-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .empty-state { padding: 50px 20px; text-align:center; color: var(--text-tertiary); font-size: 13px; }

        /* ===== 등록/수정 폼 (관리자 전용, 인라인 패널) ===== */
        .upload-panel { display:none; background: var(--gray-100); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
        .upload-panel.open { display:block; }
        .panel-mode-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 12px; }
        .upload-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .upload-grid .full { grid-column: 1 / -1; }
        .form-label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; display:block; }
        .form-input, .form-textarea { width:100%; border:1px solid var(--border); border-radius:6px; padding:8px 10px; font:inherit; font-size:13px; background:#fff; color:var(--text); }
        .form-textarea { resize: vertical; min-height: 54px; }
        .form-hint { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
        .upload-actions { display:flex; gap:8px; justify-content:flex-end; }
        .upload-status { font-size:12px; margin-top:8px; }
        .upload-status.err { color: var(--danger); }
        .upload-status.ok { color: var(--success); }

        @media (max-width: 768px) { .content { padding: 20px; } .upload-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-logo" id="brandLogo">J</div>
            <div class="brand-info">
                <div class="brand-title">💾 아카이브</div>
                <div class="brand-sub">지난 자료·참고 문서 보관함</div>
            </div>
        </div>
        <div class="hbtns">
            <a class="ghost-btn" href="./menu.html">← 메뉴로</a>
        </div>
    </header>

    <main class="content">
        <div class="page-header">
            <div>
                <h1 class="page-title">💾 아카이브</h1>
                <p class="page-subtitle">지난 자료·참고 문서 보관함</p>
            </div>
            <button class="btn btn-primary" id="uploadToggleBtn" style="display:none;" onclick="openCreatePanel()">📤 새 문서 등록</button>
        </div>

        <div class="upload-panel" id="uploadPanel">
            <div class="panel-mode-label" id="panelModeLabel">새 문서 등록</div>
            <div class="upload-grid">
                <div class="full">
                    <label class="form-label">제목</label>
                    <input type="text" class="form-input" id="docTitle" placeholder="문서 제목을 입력하세요">
                </div>
                <div class="full">
                    <label class="form-label">설명 (선택)</label>
                    <textarea class="form-textarea" id="docDesc" placeholder="간단한 설명을 입력하세요"></textarea>
                </div>
                <div class="full">
                    <label class="form-label">파일</label>
                    <input type="file" class="form-input" id="docFile">
                    <div class="form-hint" id="fileHint"></div>
                </div>
            </div>
            <div class="upload-actions">
                <button class="btn btn-secondary btn-small" onclick="toggleUploadPanel(false)">취소</button>
                <button class="btn btn-primary btn-small" id="uploadSubmitBtn" onclick="submitUpload()">업로드</button>
            </div>
            <div class="upload-status" id="uploadStatus"></div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>제목</th>
                            <th>작성자</th>
                            <th>등록일</th>
                            <th>크기</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="docRows"></tbody>
                </table>
                <div class="empty-state" id="emptyState" style="display:none;">아직 등록된 문서가 없습니다.</div>
            </div>
        </div>
    </main>

    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = './index.html'; }

        const CATEGORY = 'archive';
        const BUCKET = 'documents';
        const myUsername = sessionStorage.getItem('username') || '';
        const myPw = sessionStorage.getItem('pw') || '';
        const isAdmin = (sessionStorage.getItem('role') || '').toLowerCase() === 'admin';

        const sb = (typeof getSupabase === 'function') ? getSupabase() : null;

        let CURRENT_DOCS = [];
        let editingId = null;

        if (isAdmin) { document.getElementById('uploadToggleBtn').style.display = 'inline-flex'; }

        function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

        function fmtDate(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function fmtSize(bytes) {
            if (!bytes && bytes !== 0) return '-';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/1024/1024).toFixed(1) + ' MB';
        }
        function publicUrl(filePath) {
            if (!sb) return '#';
            return sb.storage.from(BUCKET).getPublicUrl(filePath).data.publicUrl;
        }

        function openCreatePanel() {
            editingId = null;
            document.getElementById('docTitle').value = '';
            document.getElementById('docDesc').value = '';
            document.getElementById('docFile').value = '';
            document.getElementById('panelModeLabel').textContent = '새 문서 등록';
            document.getElementById('uploadSubmitBtn').textContent = '업로드';
            document.getElementById('fileHint').textContent = '';
            toggleUploadPanel(true);
        }

        function startEdit(id) {
            const doc = CURRENT_DOCS.find(d => d.id === id);
            if (!doc) return;
            editingId = id;
            document.getElementById('docTitle').value = doc.title || '';
            document.getElementById('docDesc').value = doc.description || '';
            document.getElementById('docFile').value = '';
            document.getElementById('panelModeLabel').textContent = '문서 수정';
            document.getElementById('uploadSubmitBtn').textContent = '저장';
            document.getElementById('fileHint').textContent = '파일을 새로 고르지 않으면 기존 파일(' + (doc.file_name || '') + ')이 그대로 유지됩니다.';
            toggleUploadPanel(true);
        }

        function toggleUploadPanel(force) {
            const panel = document.getElementById('uploadPanel');
            const open = (force === undefined) ? !panel.classList.contains('open') : force;
            panel.classList.toggle('open', open);
            if (open) {
                document.getElementById('uploadStatus').textContent = '';
                document.getElementById('uploadStatus').className = 'upload-status';
            } else {
                editingId = null;
            }
        }

        async function loadDocs() {
            const tbody = document.getElementById('docRows');
            const empty = document.getElementById('emptyState');
            if (!sb) { empty.style.display = 'block'; empty.textContent = 'Supabase 연결이 설정되지 않았습니다.'; return; }
            const { data, error } = await sb
                .from('documents')
                .select('*')
                .eq('category', CATEGORY)
                .order('created_at', { ascending: false });
            if (error) {
                console.warn('문서 목록 조회 실패:', error);
                empty.style.display = 'block';
                empty.textContent = '문서 목록을 불러오지 못했습니다. (' + error.message + ')';
                tbody.innerHTML = '';
                CURRENT_DOCS = [];
                return;
            }
            CURRENT_DOCS = data || [];
            if (CURRENT_DOCS.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                empty.textContent = '아직 등록된 문서가 없습니다.';
                return;
            }
            empty.style.display = 'none';
            tbody.innerHTML = CURRENT_DOCS.map(doc => {
                const url = publicUrl(doc.file_path);
                return `
                    <tr>
                        <td>
                            <a class="doc-title" href="${url}" target="_blank" rel="noopener">${esc(doc.title)}</a>
                            ${doc.description ? `<div class="doc-desc">${esc(doc.description)}</div>` : ''}
                        </td>
                        <td class="meta">${esc(doc.uploaded_by || '-')}</td>
                        <td class="meta">${fmtDate(doc.created_at)}</td>
                        <td class="meta">${fmtSize(doc.file_size)}</td>
                        <td>
                            <div class="row-actions">
                                <a class="btn btn-secondary btn-small" href="${url}" target="_blank" rel="noopener">👁 보기</a>
                                <a class="btn btn-secondary btn-small" href="${url}" download="${esc(doc.file_name)}">⬇ 다운로드</a>
                                ${isAdmin ? `<button class="btn btn-secondary btn-small" onclick="startEdit('${doc.id}')">✎ 수정</button>` : ''}
                                ${isAdmin ? `<button class="btn btn-danger btn-small" onclick="deleteDoc('${doc.id}','${esc(doc.file_path)}')">삭제</button>` : ''}
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function submitUpload() {
            const titleEl = document.getElementById('docTitle');
            const descEl = document.getElementById('docDesc');
            const fileEl = document.getElementById('docFile');
            const statusEl = document.getElementById('uploadStatus');
            const btn = document.getElementById('uploadSubmitBtn');
            const title = titleEl.value.trim();
            const file = fileEl.files[0];

            if (!title) { statusEl.textContent = '제목을 입력해주세요.'; statusEl.className = 'upload-status err'; return; }
            if (!editingId && !file) { statusEl.textContent = '파일을 선택해주세요.'; statusEl.className = 'upload-status err'; return; }
            if (!sb) { statusEl.textContent = 'Supabase 연결이 설정되지 않았습니다.'; statusEl.className = 'upload-status err'; return; }

            btn.disabled = true;
            statusEl.textContent = editingId ? '저장 중...' : '업로드 중...';
            statusEl.className = 'upload-status';

            try {
                if (editingId) {
                    let fileFields = { p_file_name: null, p_file_path: null, p_file_size: null, p_mime_type: null };
                    let replaceFile = false;
                    if (file) {
                        const safeName = file.name.replace(/[^A-Za-z0-9.\-]/g, '_');
                        const filePath = `${CATEGORY}/${Date.now()}_${safeName}`;
                        const { error: upErr } = await sb.storage.from(BUCKET).upload(filePath, file, { upsert: false });
                        if (upErr) throw upErr;
                        fileFields = { p_file_name: file.name, p_file_path: filePath, p_file_size: file.size, p_mime_type: file.type || null };
                        replaceFile = true;
                    }
                    const { data: rpcData, error: rpcErr } = await sb.rpc('admin_update_document', {
                        p_admin_username: myUsername,
                        p_admin_password: myPw,
                        p_id: editingId,
                        p_title: title,
                        p_description: descEl.value.trim() || null,
                        ...fileFields,
                        p_replace_file: replaceFile
                    });
                    if (rpcErr) throw rpcErr;
                    if (!rpcData || rpcData.success === false) {
                        if (replaceFile) await sb.storage.from(BUCKET).remove([fileFields.p_file_path]);
                        throw new Error((rpcData && rpcData.message) || '수정 실패');
                    }
                    if (replaceFile && rpcData.old_file_path) {
                        await sb.storage.from(BUCKET).remove([rpcData.old_file_path]);
                    }
                    statusEl.textContent = '수정 완료!';
                    statusEl.className = 'upload-status ok';
                } else {
                    const safeName = file.name.replace(/[^A-Za-z0-9.\-]/g, '_');
                    const filePath = `${CATEGORY}/${Date.now()}_${safeName}`;

                    const { error: upErr } = await sb.storage.from(BUCKET).upload(filePath, file, { upsert: false });
                    if (upErr) throw upErr;

                    const { data: rpcData, error: rpcErr } = await sb.rpc('admin_insert_document', {
                        p_admin_username: myUsername,
                        p_admin_password: myPw,
                        p_category: CATEGORY,
                        p_title: title,
                        p_description: descEl.value.trim() || null,
                        p_file_name: file.name,
                        p_file_path: filePath,
                        p_file_size: file.size,
                        p_mime_type: file.type || null
                    });
                    if (rpcErr) throw rpcErr;
                    if (!rpcData || rpcData.success === false) {
                        await sb.storage.from(BUCKET).remove([filePath]);
                        throw new Error((rpcData && rpcData.message) || '등록 실패');
                    }
                    statusEl.textContent = '업로드 완료!';
                    statusEl.className = 'upload-status ok';
                }

                await loadDocs();
                setTimeout(() => toggleUploadPanel(false), 600);
            } catch (e) {
                statusEl.textContent = (editingId ? '수정 실패: ' : '업로드 실패: ') + (e.message || e);
                statusEl.className = 'upload-status err';
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteDoc(id, filePath) {
            if (!confirm('이 문서를 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
            if (!sb) return;
            const { data, error } = await sb.rpc('admin_delete_document', {
                p_admin_username: myUsername,
                p_admin_password: myPw,
                p_id: id
            });
            if (error || !data || data.success === false) {
                alert('삭제 실패: ' + (error ? error.message : (data && data.message) || '알 수 없는 오류'));
                return;
            }
            await sb.storage.from(BUCKET).remove([filePath]);
            await loadDocs();
        }

        loadDocs();

        const HEADER_THEMES = {
            A: { 'header-bg':'#0b1830', 'header-text':'#f4ede0', 'header-border':'#0b1830', 'header-border-width':'1px', 'header-btn-border':'rgba(255,255,255,0.3)', 'header-btn-hover-bg':'rgba(255,255,255,0.12)', 'logo-bg':'#c9a227', 'logo-text':'#0b1830' },
            B: { 'header-bg':'#ffffff', 'header-text':'#1e293b', 'header-border':'#e2e8f0', 'header-border-width':'1px', 'header-btn-border':'#e2e8f0', 'header-btn-hover-bg':'#f1f5f9', 'logo-bg':'#2563eb', 'logo-text':'#ffffff' },
            C: { 'header-bg':'#ffffff', 'header-text':'#16324f', 'header-border':'#16324f', 'header-border-width':'2px', 'header-btn-border':'#d7dee4', 'header-btn-hover-bg':'#f2f5f7', 'logo-bg':'#16324f', 'logo-text':'#ffffff' },
        };
        function applyHeaderTheme(key){
            const t = HEADER_THEMES[key] || HEADER_THEMES.C;
            Object.entries(t).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));
        }
        applyHeaderTheme(localStorage.getItem('dashTheme') || 'C');
        window.addEventListener('storage', (e) => { if (e.key === 'dashTheme') applyHeaderTheme(e.newValue || 'C'); });
    </script>
</body>
</html>
