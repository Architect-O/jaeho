<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 뷰어</title>

<!-- ══════════════════════════════════════════════════════════════
     문서 뷰어 — index2.html(껍데기) 안에 얹히는 내용물.

     ▶ 보여줄 문서를 추가/삭제하려면 이 파일이 아니라 docs.json만 고치세요.
     ▶ 문서 파일은 tool2/docs/ 폴더에 올립니다.
     ▶ 지원 형식: .md  .svg  .html  .txt  .json  (+ .png/.jpg)
     ══════════════════════════════════════════════════════════════ -->

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'IBM Plex Sans KR','Segoe UI',sans-serif;color:#1f2937;background:#f7f8fc;display:flex;}

  /* ── 좌측 문서 목록 ── */
  #side{width:270px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;}
  #sideHead{padding:18px 18px 12px;border-bottom:1px solid #e5e7eb;}
  #sideHead h1{font-size:14.5px;font-weight:700;}
  #sideHead p{font-size:11.5px;color:#6b7280;margin-top:3px;line-height:1.5;}
  #search{width:100%;margin-top:12px;padding:7px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:12.5px;font-family:inherit;}
  #search:focus{outline:2px solid #534AB7;outline-offset:-1px;}
  #list{flex:1;overflow-y:auto;padding:10px 10px 30px;}
  .grp{font-size:10.5px;font-weight:700;letter-spacing:.8px;color:#9ca3af;padding:14px 8px 6px;}
  .item{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:9px 10px;cursor:pointer;font-family:inherit;margin-bottom:2px;}
  .item:hover{background:#f3f4f6;}
  .item.on{background:#EEEEFF;border-color:#c7c3ef;}
  .item .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .item .d{font-size:11px;color:#6b7280;margin-top:2px;}
  .ext{font-size:9px;font-weight:700;color:#6b7280;background:#f3f4f6;border-radius:4px;padding:1px 5px;text-transform:uppercase;flex-shrink:0;}
  .badge{font-size:9px;font-weight:700;color:#4338ca;background:#e0e7ff;border-radius:10px;padding:1px 7px;flex-shrink:0;}
  .badge.warn{color:#92400e;background:#fef3c7;}
  #sideFoot{padding:10px 14px;border-top:1px solid #e5e7eb;font-size:10.5px;color:#9ca3af;}

  /* ── 우측 본문 ── */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #bar{padding:12px 22px;border-bottom:1px solid #e5e7eb;background:#fff;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  #bar .now{font-size:13.5px;font-weight:700;}
  #bar .path{font-size:11px;color:#9ca3af;font-family:'IBM Plex Mono',monospace;}
  #bar .sp{margin-left:auto;display:flex;gap:8px;}
  #bar button{padding:6px 12px;border:1px solid #e5e7eb;background:#fff;border-radius:7px;font-size:11.5px;cursor:pointer;font-family:inherit;color:#374151;}
  #bar button:hover{background:#f9fafb;}
  #view{flex:1;overflow:auto;padding:34px 26px 90px;}
  #view.figmode{padding:16px 16px 40px;}
  #doc{max-width:820px;margin:0 auto;font-size:14.5px;line-height:1.78;}
  /* 도면(SVG·이미지)일 때는 폭 제한을 풀어 화면을 꽉 채움 */
  #doc.wide{max-width:none;}

  #doc h1{font-size:24px;margin:30px 0 12px;}
  #doc h2{font-size:19px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid #e5e7eb;}
  #doc h3{font-size:16px;margin:22px 0 8px;}
  #doc h4{font-size:14px;margin:18px 0 6px;color:#374151;}
  #doc p{margin:10px 0;}
  #doc ul,#doc ol{margin:10px 0 10px 22px;}
  #doc li{margin:4px 0;}
  #doc code{background:#eef0f6;border-radius:4px;padding:1px 5px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  #doc pre{background:#1E1E2E;color:#CDD6F4;border-radius:10px;padding:15px 17px;overflow-x:auto;margin:14px 0;line-height:1.6;}
  #doc pre code{background:none;color:inherit;padding:0;font-size:12.5px;}
  #doc blockquote{border-left:3px solid #c7d2fe;background:#f8f8ff;padding:8px 0 8px 14px;color:#4b5563;margin:12px 0;border-radius:0 6px 6px 0;}
  #doc table{border-collapse:collapse;margin:14px 0;width:100%;font-size:13.5px;}
  #doc th,#doc td{border:1px solid #e5e7eb;padding:8px 11px;text-align:left;vertical-align:top;}
  #doc th{background:#f3f4f6;font-weight:700;}
  #doc tr:nth-child(even) td{background:#fcfcfd;}
  #doc a{color:#534AB7;}
  #doc hr{border:none;border-top:1px solid #e5e7eb;margin:22px 0;}
  #doc img{max-width:100%;border-radius:8px;}

  /* SVG / 이미지 문서 */
  .figure{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;overflow:auto;}
  .figure svg,.figure img{width:100%;height:auto;max-width:100%;display:block;margin:0 auto;}
  .figure.zoom{cursor:zoom-out;}
  .figure.zoom svg,.figure.zoom img{width:auto;max-width:none;}

  .empty{text-align:center;color:#9ca3af;padding:90px 20px;}
  .empty .ic{font-size:46px;margin-bottom:16px;}
  .empty h2{font-size:16px;color:#374151;margin-bottom:8px;}
  .empty p{font-size:13px;line-height:1.7;}
  .empty code{background:#eef0f6;border-radius:4px;padding:2px 7px;font-size:12px;}

  .note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:12px 15px;font-size:12.5px;line-height:1.65;margin-bottom:18px;}

  @media(max-width:760px){
    body{flex-direction:column;}
    #side{width:100%;height:auto;max-height:44%;border-right:none;border-bottom:1px solid #e5e7eb;}
  }
</style>
</head>
<body>

<div id="side">
  <div id="sideHead">
    <h1 id="sTitle">문서 자료실</h1>
    <p id="sSub"></p>
    <input id="search" type="text" placeholder="문서 검색…">
  </div>
  <div id="list"></div>
  <div id="sideFoot"><span id="cnt">–</span> · 목록은 <code>docs.json</code></div>
</div>

<div id="main">
  <div id="bar">
    <div>
      <div class="now" id="bTitle">문서를 선택하세요</div>
      <div class="path" id="bPath"></div>
    </div>
    <div class="sp">
      <button id="zoomBtn" style="display:none">🔍 원본 크기</button>
      <button id="rawBtn" style="display:none">↗ 원본 열기</button>
    </div>
  </div>
  <div id="view"><div id="doc"></div></div>
</div>

<script>
'use strict';

const listEl = document.getElementById('list');
const docEl  = document.getElementById('doc');
const viewEl = document.getElementById('view');
let ALL = [];      // 평탄화된 문서 목록
let current = null;

/* ── 1. 목록 불러오기 ── */
fetch('./docs.json', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(cfg => {
    document.getElementById('sTitle').textContent = cfg.title || '문서 자료실';
    document.getElementById('sSub').textContent   = cfg.subtitle || '';
    buildList(cfg.groups || []);
    const want = (location.hash || '').replace('#','');
    const first = ALL.find(d => d.id === want) || ALL[0];
    if (first) open(first); else showEmptyList();
  })
  .catch(() => {
    listEl.innerHTML = '<div class="grp">목록 없음</div>';
    docEl.innerHTML =
      '<div class="empty"><div class="ic">🗂</div><h2>docs.json을 찾지 못했습니다</h2>'+
      '<p><code>tool2/docs.json</code> 파일을 올리면<br>여기에 문서 목록이 나타납니다.</p></div>';
  });

function buildList(groups){
  ALL = [];
  let html = '';
  groups.forEach(g => {
    html += '<div class="grp">'+esc(g.name||'')+'</div>';
    (g.docs||[]).forEach(d => {
      ALL.push(d);
      const ext = extOf(d.file);
      const bd = d.badge ? '<span class="badge'+(/내부|비공개|주의/.test(d.badge)?' warn':'')+'">'+esc(d.badge)+'</span>' : '';
      html += '<button class="item" data-id="'+esc(d.id)+'">'+
              '<div class="t"><span class="ext">'+esc(ext)+'</span>'+esc(d.title||d.file)+bd+'</div>'+
              (d.desc ? '<div class="d">'+esc(d.desc)+'</div>' : '')+
              '</button>';
    });
  });
  listEl.innerHTML = html;
  document.getElementById('cnt').textContent = '문서 '+ALL.length+'건';
  listEl.querySelectorAll('.item').forEach(b => {
    b.onclick = () => { const d = ALL.find(x => x.id === b.dataset.id); if(d) open(d); };
  });
}

function showEmptyList(){
  docEl.innerHTML = '<div class="empty"><div class="ic">📄</div><h2>등록된 문서가 없습니다</h2>'+
    '<p><code>docs.json</code>의 <code>groups</code>에 항목을 추가하세요.</p></div>';
}

/* ── 2. 검색 ── */
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let lastGrpVisible = null;
  listEl.querySelectorAll('.grp, .item').forEach(el => {
    if (el.classList.contains('grp')) { el.style.display = ''; lastGrpVisible = el; return; }
    const hit = !q || el.textContent.toLowerCase().includes(q);
    el.style.display = hit ? '' : 'none';
  });
  // 항목이 하나도 없는 그룹 머리글 숨김
  listEl.querySelectorAll('.grp').forEach(g => {
    let n = g.nextElementSibling, any = false;
    while (n && !n.classList.contains('grp')) { if (n.style.display !== 'none') any = true; n = n.nextElementSibling; }
    g.style.display = any ? '' : 'none';
  });
});

/* ── 3. 문서 열기 ── */
function open(d){
  current = d;
  location.hash = d.id || '';
  listEl.querySelectorAll('.item').forEach(b => b.classList.toggle('on', b.dataset.id === d.id));
  document.getElementById('bTitle').textContent = d.title || d.file;
  document.getElementById('bPath').textContent  = d.file;
  const rawBtn = document.getElementById('rawBtn');
  rawBtn.style.display = '';
  rawBtn.onclick = () => window.open(d.file, '_blank');
  document.getElementById('zoomBtn').style.display = 'none';
  viewEl.scrollTop = 0;

  const ext = extOf(d.file);
  const isFigure = ['svg','png','jpg','jpeg','gif','webp'].includes(ext);
  docEl.classList.toggle('wide', isFigure);
  viewEl.classList.toggle('figmode', isFigure);

  docEl.innerHTML = '<div class="empty"><div class="ic">⏳</div><p>불러오는 중…</p></div>';

  if (ext === 'png' || ext === 'jpg' || ext === 'jpeg' || ext === 'gif' || ext === 'webp') {
    docEl.innerHTML = '<div class="figure"><img alt="'+esc(d.title||'')+'" src="'+esc(d.file)+'"></div>';
    enableZoom();
    return;
  }

  fetch(d.file, {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      if (ext === 'svg') {
        docEl.innerHTML = '<div class="figure">'+stripSvgScripts(text)+'</div>';
        enableZoom();
      } else if (ext === 'md' || ext === 'markdown') {
        docEl.innerHTML = (d.note ? '<div class="note">'+esc(d.note)+'</div>' : '') + renderMd(text);
      } else if (ext === 'html' || ext === 'htm') {
        docEl.innerHTML = '<iframe style="width:100%;height:72vh;border:1px solid #e5e7eb;border-radius:10px;background:#fff" src="'+esc(d.file)+'"></iframe>';
      } else {
        docEl.innerHTML = '<pre><code>'+esc(text)+'</code></pre>';
      }
    })
    .catch(() => {
      docEl.innerHTML = '<div class="empty"><div class="ic">⚠️</div><h2>파일을 찾지 못했습니다</h2>'+
        '<p><code>'+esc(d.file)+'</code><br><br>해당 경로에 파일을 올렸는지 확인해주세요.<br>'+
        '(대소문자·한글 파일명도 정확히 일치해야 합니다)</p></div>';
    });
}

/* SVG·이미지 확대 토글 */
function enableZoom(){
  const fig = docEl.querySelector('.figure');
  const btn = document.getElementById('zoomBtn');
  if(!fig) return;
  btn.style.display = '';
  btn.textContent = '🔍 원본 크기';
  btn.onclick = () => {
    fig.classList.toggle('zoom');
    btn.textContent = fig.classList.contains('zoom') ? '🔍 화면 맞춤' : '🔍 원본 크기';
  };
  fig.onclick = () => { if(fig.classList.contains('zoom')) btn.onclick(); };
}

/* 외부 SVG 안의 스크립트·이벤트 제거 + 고정크기 해제(반응형화) */
function stripSvgScripts(svg){
  svg = svg
    .replace(/<\?xml[\s\S]*?\?>/gi, '')
    .replace(/<!DOCTYPE[\s\S]*?>/gi, '')
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/\son\w+\s*=\s*"[^"]*"/gi, '')
    .replace(/\son\w+\s*=\s*'[^']*'/gi, '');

  // 루트 <svg>의 width/height를 떼어내고, viewBox가 없으면 원래 크기로 만들어 준다
  return svg.replace(/<svg\b([^>]*)>/i, (m, attrs) => {
    const w = (attrs.match(/\bwidth\s*=\s*["']?([\d.]+)/i) || [])[1];
    const h = (attrs.match(/\bheight\s*=\s*["']?([\d.]+)/i) || [])[1];
    let a = attrs
      .replace(/\swidth\s*=\s*["'][^"']*["']/gi, '')
      .replace(/\sheight\s*=\s*["'][^"']*["']/gi, '');
    if (!/viewBox/i.test(a) && w && h) a += ' viewBox="0 0 ' + w + ' ' + h + '"';
    if (!/preserveAspectRatio/i.test(a)) a += ' preserveAspectRatio="xMidYMid meet"';
    return '<svg' + a + '>';
  });
}

function extOf(f){ return String(f||'').split('?')[0].split('.').pop().toLowerCase(); }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── 4. 마크다운 렌더러 ── */
function renderMd(md){
  const blocks = [];
  md = md.replace(/```([\s\S]*?)```/g, (m,c) => {
    blocks.push('<pre><code>'+esc(c.replace(/^[a-zA-Z]*\n/,''))+'</code></pre>');
    return '\u0000B'+(blocks.length-1)+'\u0000';
  });

  const lines = esc(md).split('\n');
  let out = '', list = null, inTable = false;

  const inline = s => s
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');

  const closeList  = () => { if(list){ out += '</'+list+'>'; list = null; } };
  const closeTable = () => { if(inTable){ out += '</tbody></table>'; inTable = false; } };

  for (let i=0; i<lines.length; i++){
    const t = lines[i].trim();
    if (!t){ closeList(); closeTable(); continue; }

    if (/^\u0000B\d+\u0000$/.test(t)){ closeList(); closeTable(); out += blocks[+t.match(/\d+/)[0]]; continue; }

    // 표
    if (t.startsWith('|') && lines[i+1] && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i+1])){
      closeList(); closeTable();
      out += '<table><thead><tr>'+t.split('|').slice(1,-1).map(c=>'<th>'+inline(c.trim())+'</th>').join('')+'</tr></thead><tbody>';
      inTable = true; i++; continue;
    }
    if (inTable && t.startsWith('|')){
      out += '<tr>'+t.split('|').slice(1,-1).map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';
      continue;
    }
    closeTable();

    const h = t.match(/^(#{1,5})\s+(.*)$/);
    if (h){ closeList(); const n = h[1].length; out += '<h'+n+'>'+inline(h[2])+'</h'+n+'>'; continue; }

    if (/^&gt;\s?/.test(t)){ closeList(); out += '<blockquote>'+inline(t.replace(/^&gt;\s?/,''))+'</blockquote>'; continue; }

    if (/^(-{3,}|\*{3,}|={3,})$/.test(t)){ closeList(); out += '<hr>'; continue; }

    if (/^[-*+]\s+/.test(t)){
      if(list!=='ul'){ closeList(); out += '<ul>'; list='ul'; }
      out += '<li>'+inline(t.replace(/^[-*+]\s+/,''))+'</li>'; continue;
    }
    if (/^\d+\.\s+/.test(t)){
      if(list!=='ol'){ closeList(); out += '<ol>'; list='ol'; }
      out += '<li>'+inline(t.replace(/^\d+\.\s+/,''))+'</li>'; continue;
    }

    closeList();
    out += '<p>'+inline(t)+'</p>';
  }
  closeList(); closeTable();
  return out;
}
</script>
</body>
</html>
