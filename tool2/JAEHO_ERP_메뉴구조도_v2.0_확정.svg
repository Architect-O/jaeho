<text x="40" y="710" font-size="12" font-weight="bold" fill="#4A1B0C">영업 사이클</text>
<text x="40" y="728" font-size="11" fill="#444441">견적서작성 → 주문서작성 → 출고지시등록 → 출고현황 → 매출원장 → 수금등록</text>

<text x="40" y="752" font-size="12" font-weight="bold" fill="#4B1528">자재 사이클</text>
<text x="40" y="770" font-size="11" fill="#444441">구매발주서작성 → 입고등록-New → 입고현황 → 매입원장 → 지급등록 (+사업장간 재고이동)</text>

<text x="720" y="710" font-size="12" font-weight="bold" fill="#412402">생산 사이클</text>
<text x="720" y="728" font-size="11" fill="#444441">생산계획등록 → 작업지시등록(확정) → 생산실적등록 → 생산실적현황</text>

<text x="720" y="752" font-size="12" font-weight="bold" fill="#042C53">무역 사이클</text>
<text x="720" y="770" font-size="11" fill="#444441">PI현황(계약) → BL등록(선적) → Usance한도등록(신용장) → 만기일조회(결제관리)</text>

<!-- ===== BOM 연계 강조 ===== -->
<rect x="20" y="800" width="1360" height="70" rx="8" fill="#FFF6D9" stroke="#FAC775" stroke-width="1.5"/>
<text x="700" y="822" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">⚠ 핵심 연계: 원자재 BOM (기준관리) → 구매발주(자재관리) → 작업지시(생산관리) → 생산실적</text>
<text x="700" y="842" text-anchor="middle" font-size="11" fill="#633806">BOM 전개 결과가 자재 소요량을 결정하고, 이는 구매발주서·생산계획 수립의 기준 데이터가 됨</text>
<text x="700" y="858" text-anchor="middle" font-size="10" fill="#808080">신규 SaaS 설계 시 BOM 엔진을 별도 마이크로서비스로 분리하여 자재/생산/원가계산이 공통 참조하도록 설계 권고</text>

