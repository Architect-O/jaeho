<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Design - JAEHO ERP Suite</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body{font-family:'IBM Plex Sans KR','Segoe UI',sans-serif;background:#f7f8fc;min-height:100vh;color:#1f2937;}
  header{background:linear-gradient(135deg,#6366f1 0%,#534AB7 100%);color:#fff;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;}
  .brand{font-size:16px;font-weight:700;}
  .nav-btns{display:flex;gap:10px;}
  .nav-btns button{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;}
  .wrap{max-width:640px;margin:80px auto;text-align:center;padding:0 24px;}
  .icon{font-size:56px;margin-bottom:20px;}
  h1{font-size:22px;margin-bottom:10px;}
  p{color:#6b7280;font-size:14px;line-height:1.6;}
  .tag{display:inline-block;margin-top:20px;background:#e0e7ff;color:#4338ca;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;}
</style>
</head>
<body>
<header>
  <div class="brand">🎯 Process Design</div>
  <div class="nav-btns">
    <button onclick="window.location.href='../menu.html'">☰ 메뉴</button>
    <button onclick="handleLogout()">로그아웃</button>
  </div>
</header>
<div class="wrap">
  <div class="icon">🎯</div>
  <h1>Process Design</h1>
  <p>미래 업무프로세스 고도화 설계 도구입니다.<br>현재 개발 중이며 곧 만나보실 수 있습니다.</p>
  <div class="tag">STEP 2 · 준비중</div>
</div>
<script>
  if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = '../index.html'; }
  function handleLogout(){
    if(confirm('로그아웃하시겠습니까?')){
      sessionStorage.removeItem('isLoggedIn');
      sessionStorage.removeItem('username');
      sessionStorage.removeItem('loginTime');
      window.location.href='../index.html';
    }
  }
</script>
</body>
</html>
