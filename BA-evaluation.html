<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도입 평가 - JAEHO ERP Suite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    /* 대시보드(dashboard-master.html)와 동일한 헤더 변수 — 테마 선택 시 이 페이지의 상단바도 같이 바뀝니다 */
    --header-bg:#ffffff; --header-text:#16324f; --header-border:#16324f; --header-border-width:2px;
    --header-btn-border:#d7dee4; --header-btn-hover-bg:#f2f5f7; --logo-bg:#16324f; --logo-text:#ffffff;
    /* 대시보드와 동일한 콘텐츠 변수 */
    --content-bg:#ffffff; --card-bg:#ffffff; --text:#1f2328; --text-secondary:#6b7280; --text-tertiary:#9ca3af;
    --border:#e8eaed; --primary:#16324f;
  }
  body{font-family:'IBM Plex Sans KR','Segoe UI',sans-serif;background:var(--content-bg);color:var(--text);min-height:100vh;}
  a{color:inherit;}

  /* ===== Header — 대시보드와 동일한 크기/구조 (테마 색상 실시간 반영) ===== */
  header{
    height:56px; background:var(--header-bg); color:var(--header-text);
    border-bottom:var(--header-border-width) solid var(--header-border);
    display:flex; align-items:center; justify-content:space-between; padding:0 24px;
    transition:background .2s,color .2s,border-color .2s;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo{width:28px;height:28px;background:var(--logo-bg);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--logo-text);font-weight:700;font-size:13px;flex-shrink:0;}
  .brand-info{display:flex;flex-direction:column;line-height:1.25;}
  .brand-title{font-size:14px;font-weight:600;color:var(--header-text);}
  .brand-sub{font-size:11px;color:var(--header-text);opacity:0.65;}
  .hbtns{display:flex;gap:8px;flex-wrap:wrap;}
  .ghost-btn{
    background:transparent;border:1px solid var(--header-btn-border);color:var(--header-text);
    padding:6px 12px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;
  }
  .ghost-btn:hover{background:var(--header-btn-hover-bg);}

  /* 다른 모듈(kpi/timeline/progress/reports 등)과 동일한 본문 여백 — 화면 전환 시 좌우 폭이 안 흔들리도록 */
  main{width:100%;padding:30px;}
  @media (max-width:768px){ main{padding:20px;} }

  /* ===== 대시보드와 동일한 콘텐츠 스타일 ===== */
  .page-title{font-size:22px;font-weight:700;margin-bottom:4px;}
  .page-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:30px;}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  .compare-table{width:100%;border-collapse:collapse;font-size:13px;}
  .compare-table th, .compare-table td{border:1px solid var(--border);padding:12px 16px;text-align:left;}
  .compare-table th{background:#f8f9fa;font-size:11.5px;text-transform:uppercase;color:var(--text-secondary);}
  .compare-table tr td:first-child{font-weight:600;background:#fcfcfd;}

  /* ===== 2026-09-18 개선: 점수를 숫자(1~5)만으로 보여주면 기준을 모르는 사람은 "5점이 어느 위치인지" 감이 안 옴.
     별 5개를 채워서 한눈에 위치를 알 수 있게 하는 별점 위젯. 순수 CSS 라디오 트릭(값이 큰 라디오부터 DOM에 두고
     flex-direction:row-reverse로 뒤집는 방식)이라 서버/자바스크립트 없이 마우스오버 미리보기까지 동작함.
     BF-eval-detail.html에도 동일한 CSS/구조가 복제되어 있음 — 손보면 두 파일 모두 갱신할 것. */
  /* 2026-09-18 재정리: 행마다 붙던 "n/5"·"미입력" 텍스트와 ✕ 지우기 버튼을 없애 별만 남기고,
     척도 설명은 표 위 범례(.star-legend)에 한 번만 표시한다(사용자 피드백: 반복 텍스트가 지저분하고,
     ✕ 버튼은 "선택된 별을 다시 클릭하면 취소"와 기능이 겹쳐 중복이라는 지적). */
  .star-rating-wrap{display:inline-flex;align-items:center;justify-content:center;}
  .star-rating{display:inline-flex;flex-direction:row-reverse;gap:1px;font-size:18px;}
  .star-rating input{display:none;}
  .star-rating label{cursor:pointer;color:var(--gray-300,#dfe3e7);line-height:1;transition:color .1s;}
  .star-rating label::before{content:'★';}
  .star-rating input:checked ~ label,
  .star-rating label:hover,
  .star-rating label:hover ~ label{color:#f5a623;}
  .star-rating-ro{display:inline-flex;font-size:18px;line-height:1;}
  .star.filled{color:#f5a623;}
  .star.empty{color:var(--gray-300,#dfe3e7);}
  .star-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary);background:#f8f9fa;border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin-bottom:14px;}
  .star-legend b{color:var(--text);font-weight:700;}
  .star-legend .legend-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .star-legend .legend-item .star-rating-ro{font-size:13px;}
  .star-legend .legend-hint{margin-left:auto;color:var(--text-tertiary);font-style:italic;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo" id="brandLogo">J</div>
    <div class="brand-info">
      <div class="brand-title" id="brandTitle">⚖️ 도입 평가</div>
      <div class="brand-sub" id="brandSub">여러 도입 후보를 기준별로 비교합니다</div>
    </div>
  </div>
  <div class="hbtns">
    <a class="ghost-btn" href="./menu.html">← 메뉴로</a>
  </div>
</header>

<main>
  <div id="evalContent"></div>
</main>

<script>
  if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = './index.html'; }

  const myUsername = sessionStorage.getItem('username');
  const myPw = sessionStorage.getItem('pw');
  const isAdmin = sessionStorage.getItem('role') === 'admin';

  /* ===== 헤더 테마 — dashboard-master.html / settings.html과 동일한 값 ===== */
  const HEADER_THEMES = {
    A: { 'header-bg':'#0b1830', 'header-text':'#f4ede0', 'header-border':'#0b1830', 'header-border-width':'1px', 'header-btn-border':'rgba(255,255,255,0.3)', 'header-btn-hover-bg':'rgba(255,255,255,0.12)', 'logo-bg':'#c9a227', 'logo-text':'#0b1830' },
    B: { 'header-bg':'#ffffff', 'header-text':'#1e293b', 'header-border':'#e2e8f0', 'header-border-width':'1px', 'header-btn-border':'#e2e8f0', 'header-btn-hover-bg':'#f1f5f9', 'logo-bg':'#2563eb', 'logo-text':'#ffffff' },
    C: { 'header-bg':'#ffffff', 'header-text':'#16324f', 'header-border':'#16324f', 'header-border-width':'2px', 'header-btn-border':'#d7dee4', 'header-btn-hover-bg':'#f2f5f7', 'logo-bg':'#16324f', 'logo-text':'#ffffff' },
  };
  function applyHeaderTheme(key){
    const t = HEADER_THEMES[key] || HEADER_THEMES.C;
    Object.entries(t).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));
  }
  applyHeaderTheme(localStorage.getItem('dashTheme') || 'C');

  /* ===== 언어 — dashboard-master.html과 동일한 L() 도우미 ===== */
  let currentLang = localStorage.getItem('dashLang') || 'ko';
  function L(ko, en) {
    if (currentLang === 'en') return en;
    if (currentLang === 'both') return ko + ' · ' + en;
    return ko;
  }
  function renderHeaderTexts(){
    document.getElementById('brandTitle').textContent = '⚖️ ' + L('도입 평가', 'Adoption Evaluation');
    document.getElementById('brandSub').textContent = L('여러 도입 후보를 기준별로 비교합니다', 'Compare adoption candidates by criteria');
    document.querySelector('.hbtns .ghost-btn').textContent = '← ' + L('메뉴로', 'Menu');
  }
  renderHeaderTexts();

  /* ===== Supabase 연동: 테마/언어/평가 데이터를 전 기기·전 사용자 공유 =====
     조회(읽기)는 로그인 여부와 무관하게 누구나 가능(get_dashboard_settings),
     저장(쓰기)은 관리자만 가능(admin_update_setting이 DB에서 권한을 검증) */
  async function fetchDashboardSettings(){
    try {
      const sb = (typeof getSupabase === 'function') ? getSupabase() : null;
      if (!sb) return null;
      const { data, error } = await sb.rpc('get_dashboard_settings');
      if (error) throw error;
      return data || {};
    } catch(e) { console.warn('공유 설정 조회 실패(로컬 값 사용):', e); return null; }
  }
  async function saveDashboardSetting(key, value){
    try {
      const sb = (typeof getSupabase === 'function') ? getSupabase() : null;
      if (!sb || !myUsername || !myPw) return { success:false, message:'로그인 정보가 없습니다.' };
      const { data, error } = await sb.rpc('admin_update_setting', { p_admin_username: myUsername, p_admin_password: myPw, p_key: key, p_value: value });
      if (error) throw error;
      return data;
    } catch(e) { console.error('공유 설정 저장 실패:', e); return { success:false, message: e.message }; }
  }
  async function syncFromCloud(){
    const remote = await fetchDashboardSettings();
    if (!remote) return;
    if (remote.dash_theme) { localStorage.setItem('dashTheme', remote.dash_theme); applyHeaderTheme(remote.dash_theme); }
    if (remote.dash_lang) { currentLang = remote.dash_lang; localStorage.setItem('dashLang', currentLang); renderHeaderTexts(); }
    if (remote.dash_eval_programs) localStorage.setItem('evalPrograms', remote.dash_eval_programs);
    if (remote.dash_eval_values) localStorage.setItem('evalValues', remote.dash_eval_values);
  }

  let _evalSaveTimer = null;
  function scheduleEvalCloudSave() {
    if (!isAdmin) return;
    clearTimeout(_evalSaveTimer);
    _evalSaveTimer = setTimeout(persistEvalToCloud, 800);
  }
  async function persistEvalToCloud() {
    if (!isAdmin) return;
    await saveDashboardSetting('dash_eval_programs', JSON.stringify(loadEvalPrograms()));
    await saveDashboardSetting('dash_eval_values', JSON.stringify(loadEvalValues()));
  }

  /* ===== 도입 평가 · 종합 비교 (동적 프로그램 추가/삭제/편집) =====
     예전 dashboard-master.html 안에 있던 로직을 이 독립 파일로 옮겼습니다.
     프로그램 열 추가/이름변경/삭제, 각 셀 값 입력이 모두 즉시 localStorage에
     저장되고, 관리자가 편집하면 Supabase(app_settings)로 전체 공유됩니다. */
  /* ===== 2026-09-18 고도화: 표준기준(7)+우리기준(12) 2트랙 가중치 점수제 =====
     항목마다 1~5 정수 원점수를 입력받고, 환산점수 = 가중치 × (원점수÷5).
     트랙 합계 = 그 트랙 항목 환산점수의 합(100점 만점), 최종점수 = (표준+우리)/2.
     상세 설계 근거는 Claude Project 문서 `모듈_도입평가_고도화.md` 참고.
     BF-eval-detail.html에도 완전히 동일한 EVAL_TRACKS가 있음 — 항목을 고치면 두 파일 모두 갱신할 것. */
  const EVAL_TRACKS = [
    { key: 'std', ko: '표준기준', en: 'Standard Criteria', items: [
      { key: 'std_feature', ko: '기능 충족도', en: 'Feature Fit', w: 25 },
      { key: 'std_initCost', ko: '초기 도입 비용', en: 'Initial Cost', w: 15 },
      { key: 'std_maintCost', ko: '유지보수 비용', en: 'Maintenance Cost', w: 15 },
      { key: 'std_buildTime', ko: '구축 기간', en: 'Implementation Time', w: 15 },
      { key: 'std_customization', ko: '커스터마이징 자유도', en: 'Customization Flexibility', w: 10 },
      { key: 'std_support', ko: '기술 지원', en: 'Technical Support', w: 10 },
      { key: 'std_security', ko: '데이터 보안', en: 'Data Security', w: 10 },
    ]},
    { key: 'ours', ko: '우리기준', en: 'Our Criteria', items: [
      { key: 'ours_trade', ko: '무역관리(USANCE) 대응력', en: 'Trade (USANCE) Fit', w: 10 },
      { key: 'ours_bom', ko: '자재관리 BOM 연계 정확도', en: 'BOM Linkage Accuracy', w: 12 },
      { key: 'ours_prod', ko: '생산관리공통 프로세스 적합도', en: 'Production Process Fit', w: 9 },
      { key: 'ours_sales', ko: '영업관리 프로세스 적합도', en: 'Sales Process Fit', w: 9 },
      { key: 'ours_master', ko: '기준관리(기초정보) 유연성', en: 'Master Data Flexibility', w: 7 },
      { key: 'ours_security', ko: '내부 보안·커스터마이징 자유도', en: 'Internal Security Customization', w: 7 },
      { key: 'ours_hr', ko: '인력 구조 대응력', en: 'Workforce Structure Fit', w: 10 },
      { key: 'ours_multitenancy', ko: '멀티테넌시·통합모듈 지원', en: 'Multi-tenancy Support', w: 7 },
      { key: 'ours_roleAccount', ko: '부서·역할 기반 계정 구조', en: 'Role-based Accounts', w: 7 },
      { key: 'ours_pnl', ko: '손익·비용구조 도출 유연성', en: 'P&L Derivation Flexibility', w: 7 },
      { key: 'ours_residual', ko: '실패·부분도입 시 잔존가치', en: 'Residual Value on Failure', w: 6 },
      { key: 'ours_govfit', ko: '정부지원사업 적합성(로그·존속의무)', en: 'Gov. Support Program Fit', w: 9 },
    ]},
  ];
  function allEvalItems() { return EVAL_TRACKS.flatMap(t => t.items); }
  function itemScoreContribution(values, pid, item) {
    const raw = Number((values[pid] || {})[item.key]);
    if (!raw || raw < 1 || raw > 5) return 0;
    return item.w * (raw / 5);
  }
  function trackTotal(values, pid, trackKey) {
    const track = EVAL_TRACKS.find(t => t.key === trackKey);
    return track.items.reduce((sum, it) => sum + itemScoreContribution(values, pid, it), 0);
  }
  function finalScore(values, pid) {
    return (trackTotal(values, pid, 'std') + trackTotal(values, pid, 'ours')) / 2;
  }
  function fmtScore(n) { return (Math.round(n * 10) / 10).toFixed(1); }

  function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function loadEvalPrograms() {
    try {
      const raw = localStorage.getItem('evalPrograms');
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    const def = [
      { id: 'inhouse', name: L('자체 개발', 'In-house'), icon: '🛠️' },
      { id: 'p1', name: L('파일럿: 프로그램 1', 'Pilot: Program 1'), icon: '🧪' },
      { id: 'p2', name: L('파일럿: 프로그램 2', 'Pilot: Program 2'), icon: '🧪' },
    ];
    localStorage.setItem('evalPrograms', JSON.stringify(def));
    return def;
  }
  function saveEvalPrograms(list) { localStorage.setItem('evalPrograms', JSON.stringify(list)); }
  function loadEvalValues() {
    try { const raw = localStorage.getItem('evalValues'); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
  }
  function saveEvalValues(obj) { localStorage.setItem('evalValues', JSON.stringify(obj)); }

  function refreshCompareScreen() {
    document.getElementById('evalContent').innerHTML = compareHTML();
  }

  // 이 페이지는 보통 menu.html의 iframe 안에서 열린다(같은 origin, srcdoc).
  // 프로그램 열을 추가/삭제/이름변경할 때마다 셸(menu.html)의 사이드 메뉴도
  // 그 자리에서 바로 새로고침해서 "새 프로그램을 추가하면 사이드 메뉴에도
  // 바로 나타난다"가 탭을 다시 눌러야만 반영되지 않고 즉시 되도록 한다.
  function notifyShellSidebar() {
    try { if (window.parent && window.parent !== window && typeof window.parent.renderSidebar === 'function') window.parent.renderSidebar(); }
    catch (e) {}
  }

  function addEvalProgram() {
    if (!isAdmin) return;
    const list = loadEvalPrograms();
    const id = 'prog_' + Date.now();
    list.push({ id, name: L('새 프로그램', 'New Program') + ' ' + (list.length + 1), icon: '🧪' });
    saveEvalPrograms(list);
    const values = loadEvalValues(); values[id] = {}; saveEvalValues(values);
    refreshCompareScreen();
    notifyShellSidebar();
    persistEvalToCloud();
  }
  function removeEvalProgram(id) {
    if (!isAdmin) return;
    const list = loadEvalPrograms();
    if (list.length <= 1) { alert(L('최소 1개의 항목은 남아있어야 합니다.', 'At least one column must remain.')); return; }
    if (!confirm(L('이 프로그램 열을 삭제할까요?', 'Delete this program column?'))) return;
    saveEvalPrograms(list.filter(p => p.id !== id));
    const values = loadEvalValues(); delete values[id]; saveEvalValues(values);
    refreshCompareScreen();
    notifyShellSidebar();
    persistEvalToCloud();
  }
  function renameEvalProgram(id, name) {
    if (!isAdmin) return;
    const list = loadEvalPrograms();
    const p = list.find(x => x.id === id);
    if (p) { p.name = name; saveEvalPrograms(list); }
    notifyShellSidebar();
    scheduleEvalCloudSave();
  }
  function updateEvalValue(pid, ck, val) {
    if (!isAdmin) return;
    const values = loadEvalValues();
    values[pid] = values[pid] || {};
    values[pid][ck] = val;
    saveEvalValues(values);
    // 2026-09-18: 별점 클릭 직후 별은 (브라우저 기본 라디오 동작으로) 바로 채워지지만,
    // 표 전체를 다시 그리지 않으면 옆의 "n/5" 숫자·✕ 지우기 버튼·트랙 합계/최종평균 행이
    // 갱신되지 않아 "클릭해도 반응이 이상하다"처럼 보였다. 클릭할 때마다 표를 다시 그려서
    // 모든 숫자가 항상 방금 입력한 값과 일치하도록 한다.
    refreshCompareScreen();
    scheduleEvalCloudSave();
  }

  /* 별점 위젯 — 1~5점을 별 5개로 시각화. editable=false면 값에 맞게 채워진/빈 별만 정적으로 보여주고,
     editable=true면 라디오 5개(값 큰 것부터 DOM에 배치 + row-reverse)로 클릭·마우스오버 모두 지원.
     name에는 위젯마다 겹치지 않는 고유 문자열(pid+item.key)을 넣어야 라디오 그룹이 서로 안 꼬임. */
  /* 2026-09-18 재정리: 행마다 "n/5"·"미입력" 텍스트와 ✕ 버튼을 붙이던 걸 없애고 별만 남김 —
     척도 설명은 starLegendHTML()로 표 위에 한 번만 표시. 정확한 값은 별에 마우스를 올리면
     title 툴팁으로 확인 가능. */
  function starRatingHTML(name, val, editable, onChangeExpr, onClearExpr) {
    const v = Number(val) || 0;
    if (!editable) {
      const stars = [1, 2, 3, 4, 5].map(n => `<span class="star ${n <= v ? 'filled' : 'empty'}">★</span>`).join('');
      return `<span class="star-rating-ro" title="${v ? v + '/5' : L('미입력', 'not scored')}">${stars}</span>`;
    }
    // 라디오 버튼은 원래 "이미 선택된 걸 다시 클릭"해도 저절로 해제되지 않으므로, 지금 선택된
    // 값과 같은 별에는 onclick을 따로 달아 "다시 클릭 = 선택 해제(미입력으로)"가 되도록 한다.
    // (다른 값으로 바뀌는 클릭/키보드 이동은 그대로 onchange가 처리 — this.value로 새 값 저장)
    let radios = '';
    for (let n = 5; n >= 1; n--) {
      const id = 'star-' + name + '-' + n;
      const isCurrent = v === n;
      radios += `<input type="radio" id="${id}" name="star-${name}" value="${n}" ${isCurrent ? 'checked' : ''}
          onchange="${esc(onChangeExpr)}"${isCurrent ? ` onclick="this.checked=false;${esc(onClearExpr)}"` : ''}>
        <label for="${id}" title="${n}${L('점', 'pt')}${isCurrent ? ' · ' + L('다시 클릭하면 취소', 'click again to clear') : ''}"></label>`;
    }
    return `<span class="star-rating-wrap"><span class="star-rating" title="${v ? v + L('점', 'pt') : L('미입력', 'not scored')}">${radios}</span></span>`;
  }

  /* 표 위에 한 번만 표시하는 척도 범례 — "별 개수 = 점수"라는 걸 한 곳에서 명확히 설명해서,
     행마다 텍스트를 반복하지 않아도 되게 한다. */
  function starLegendHTML() {
    const mini = n => `<span class="star-rating-ro">${[1,2,3,4,5].map(i => `<span class="star ${i <= n ? 'filled' : 'empty'}">★</span>`).join('')}</span>`;
    return `<div class="star-legend">
        <b>${L('평가 척도', 'Scale')}</b>
        <span class="legend-item">${mini(1)} 1${L('점(미흡)', 'pt (poor)')}</span>
        <span class="legend-item">${mini(3)} 3${L('점(보통)', 'pt (fair)')}</span>
        <span class="legend-item">${mini(5)} 5${L('점(우수)', 'pt (excellent)')}</span>
        ${isAdmin ? `<span class="legend-hint">${L('별을 클릭해 평가 · 선택된 별을 다시 클릭하면 취소', 'Click a star to score · click the selected star again to clear it')}</span>` : ''}
      </div>`;
  }

  function scoreCellHTML(pid, item, values) {
    const val = (values[pid] || {})[item.key] || '';
    const name = pid + '-' + item.key;
    if (!isAdmin) return `<td style="text-align:center;">${starRatingHTML(name, val, false)}</td>`;
    return `<td style="padding:4px 6px;text-align:center;">
        ${starRatingHTML(name, val, true,
          `updateEvalValue('${pid}','${item.key}', this.value)`,
          `updateEvalValue('${pid}','${item.key}', '')`)}
      </td>`;
  }

  function trackGroupRows(trackKey, programs, values) {
    const track = EVAL_TRACKS.find(t => t.key === trackKey);
    const groupHeader = `
        <tr>
            <td colspan="${programs.length + 1}" style="background:#eef2f6;font-weight:700;font-size:12px;color:var(--primary);letter-spacing:.3px;">
                ▍${L(track.ko, track.en)} <span style="font-weight:400;color:var(--text-tertiary);">(${L('100점 만점', 'out of 100')})</span>
            </td>
        </tr>`;
    const itemRows = track.items.map(item => `
        <tr>
            <td>${L(item.ko, item.en)} <span style="color:var(--text-tertiary);font-size:11px;">(${item.w}${L('점', 'pt')})</span></td>
            ${programs.map(p => scoreCellHTML(p.id, item, values)).join('')}
        </tr>
    `).join('');
    const totalRow = `
        <tr>
            <td style="font-weight:700;background:#f8f9fa;">${L(track.ko + ' 합계', track.en + ' Total')}</td>
            ${programs.map(p => `<td style="text-align:center;font-weight:700;background:#f8f9fa;">${fmtScore(trackTotal(values, p.id, trackKey))}</td>`).join('')}
        </tr>`;
    return groupHeader + itemRows + totalRow;
  }

  function compareHTML() {
    const programs = loadEvalPrograms();
    const values = loadEvalValues();
    const cellFocus = "this.style.borderColor='var(--border)';this.style.background='#fff';";
    const cellBlur = "this.style.borderColor='transparent';this.style.background='transparent';";
    const dis = isAdmin ? '' : 'disabled';
    const subtitle = isAdmin
      ? L('항목마다 1~5점을 매기면 가중치대로 자동 환산·합산됩니다. 프로그램 열을 자유롭게 추가·이름변경·삭제할 수 있습니다.', 'Score each item 1–5; weighted totals are computed automatically. Freely add, rename, or remove program columns.')
      : L('실시간으로 공유되는 도입 평가 데이터입니다 (읽기 전용 · 관리자만 수정 가능).', 'Live shared adoption evaluation data (read-only — admins only can edit).');
    return `
      <div class="page-title">⚖️ ${L('도입 평가 · 종합 비교', 'Adoption Evaluation · Comparison')}</div>
      <div class="page-subtitle" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <span>${subtitle}</span>
          <button class="ghost-btn" onclick="syncFromCloud().then(refreshCompareScreen)" style="flex-shrink:0;">🔄 ${L('새로고침', 'Refresh')}</button>
      </div>
      ${starLegendHTML()}
      <div class="card" style="overflow-x:auto;">
          <table class="compare-table">
              <thead>
                  <tr>
                      <th style="min-width:200px;">${L('평가 항목', 'Criteria')}</th>
                      ${programs.map(p => `
                          <th style="min-width:150px;">
                              <div style="display:flex;align-items:center;gap:6px;">
                                  <span>${p.icon || '🧪'}</span>
                                  <input type="text" value="${esc(p.name)}" oninput="renameEvalProgram('${p.id}', this.value)" ${dis}
                                         style="flex:1;min-width:0;border:1px solid transparent;background:transparent;font:inherit;font-weight:700;text-transform:none;color:var(--text-secondary);padding:3px 4px;border-radius:5px;"
                                         onfocus="${cellFocus}" onblur="${cellBlur}">
                                  ${isAdmin ? `<button onclick="removeEvalProgram('${p.id}')" title="${L('열 삭제', 'Remove column')}"
                                          style="border:none;background:transparent;color:var(--text-tertiary);cursor:pointer;font-size:12px;flex-shrink:0;">🗑</button>` : ''}
                              </div>
                          </th>
                      `).join('')}
                  </tr>
              </thead>
              <tbody>
                  ${trackGroupRows('std', programs, values)}
                  ${trackGroupRows('ours', programs, values)}
                  <tr>
                      <td style="font-weight:700;background:#16324f;color:#fff;">${L('최종 평균 점수', 'Final Average Score')}</td>
                      ${programs.map(p => `<td style="text-align:center;font-weight:700;background:#16324f;color:#fff;font-size:15px;">${fmtScore(finalScore(values, p.id))}</td>`).join('')}
                  </tr>
              </tbody>
          </table>
      </div>
      ${isAdmin ? `
      <div style="margin-top:16px;">
          <button class="ghost-btn" onclick="addEvalProgram()">+ ${L('프로그램 추가', 'Add Program')}</button>
      </div>` : ''}
    `;
  }

  /* ===== 초기 렌더: 로컬 캐시로 즉시 표시 → 최신 공유 데이터로 갱신 ===== */
  refreshCompareScreen();
  syncFromCloud().then(refreshCompareScreen);

  /* 다른 탭에서 테마/언어/평가 데이터가 바뀌면 이 페이지도 동기화 */
  window.addEventListener('storage', (e) => {
    if (e.key === 'dashTheme') applyHeaderTheme(e.newValue || 'C');
    if (e.key === 'dashLang') { currentLang = e.newValue || 'ko'; renderHeaderTexts(); refreshCompareScreen(); }
    if (e.key === 'evalPrograms' || e.key === 'evalValues') refreshCompareScreen();
  });
</script>
</body>
</html>
