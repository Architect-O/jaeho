<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업 로그 - JAEHO ERP Suite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            /* 대시보드(dashboard-master.html)와 동일한 헤더/콘텐츠 변수 — 테마 선택 시 이 페이지도 같이 바뀝니다 */
            --header-bg:#ffffff; --header-text:#16324f; --header-border:#16324f; --header-border-width:2px;
            --header-btn-border:#d7dee4; --header-btn-hover-bg:#f2f5f7; --logo-bg:#16324f; --logo-text:#ffffff;
            --content-bg:#ffffff; --card-bg:#ffffff; --text:#1f2328; --text-secondary:#6b7280; --text-tertiary:#9ca3af;
            --border:#e8eaed; --primary: var(--logo-bg);
            --success:#10b981; --success-soft:#ecfdf5; --warning:#f59e0b; --warning-soft:#fffbeb;
            --info:#3b82f6; --info-soft:#eff6ff; --gray-100:#f8f9fa; --gray-200:#eceef0; --gray-300:#dfe3e7;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.06);
        }
        body { font-family: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--content-bg); color: var(--text); }
        a { color: inherit; }

        /* ===== Header — 대시보드와 동일한 구조 (테마 색상 실시간 반영) ===== */
        header{
            height:56px; background:var(--header-bg); color:var(--header-text);
            border-bottom:var(--header-border-width) solid var(--header-border);
            display:flex; align-items:center; justify-content:space-between; padding:0 24px;
            transition:background .2s,color .2s,border-color .2s;
        }
        .brand{display:flex;align-items:center;gap:10px;}
        .brand-logo{width:28px;height:28px;background:var(--logo-bg);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--logo-text);font-weight:700;font-size:13px;flex-shrink:0;}
        .brand-info{display:flex;flex-direction:column;line-height:1.25;}
        .brand-title{font-size:14px;font-weight:600;color:var(--header-text);}
        .brand-sub{font-size:11px;color:var(--header-text);opacity:0.65;}
        .hbtns{display:flex;gap:8px;flex-wrap:wrap;}
        .ghost-btn{
            background:transparent;border:1px solid var(--header-btn-border);color:var(--header-text);
            padding:6px 12px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;
            text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;
        }
        .ghost-btn:hover{background:var(--header-btn-hover-bg);}

        .content { width: 100%; padding: 30px; background: var(--content-bg); overflow-y: auto; }
        .page-header { margin-bottom: 22px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: var(--text-secondary); }
        .snapshot-note { font-size: 11.5px; color: var(--text-tertiary); background: var(--gray-100); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; max-width: 340px; line-height:1.5; }

        .card { background: var(--card-bg); border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .card-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 18px; }

        .log-timeline { position: relative; padding-left: 30px; }
        .log-item { position: relative; padding-bottom: 22px; border-left: 2px solid var(--gray-200); }
        .log-item:last-child { border-left-color: transparent; padding-bottom: 0; }
        .log-dot { position: absolute; width: 12px; height: 12px; background: var(--primary); border: 3px solid var(--card-bg); border-radius: 50%; left: -21px; top: 2px; box-shadow: 0 0 0 1px var(--gray-300); }
        .log-dot.unused { background: var(--gray-300); }
        .log-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom: 5px; }
        .log-date { font-size: 12.5px; font-weight: 700; color: var(--text); }
        .log-time { font-size: 11px; color: var(--text-tertiary); }
        .log-title { font-weight: 600; font-size: 13.5px; color: var(--text); margin-bottom: 4px; }
        .log-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 8px; }
        .log-files { display:flex; flex-wrap:wrap; gap:6px; }
        .file-chip { font-size: 10.5px; font-family: 'SFMono-Regular', Consolas, monospace; background: var(--gray-100); color: var(--text-secondary); border: 1px solid var(--border); padding: 2px 7px; border-radius: 5px; }
        .file-chip.unused { color: var(--text-tertiary); text-decoration: line-through; opacity:0.75; }

        .day-divider { display:flex; align-items:center; gap:10px; margin: 22px 0 14px; padding-left: 0; }
        .day-divider:first-child { margin-top: 0; }
        .day-divider .line { flex:1; height:1px; background: var(--border); }
        .day-divider .label { font-size: 11px; font-weight: 700; color: var(--text-tertiary); letter-spacing:.3px; white-space:nowrap; }

        .badge-inline { display:inline-block; font-size: 9.5px; font-weight:700; text-transform:uppercase; padding: 2px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .badge-unused { background: var(--gray-100); color: var(--text-tertiary); }
        .badge-fix { background: var(--warning-soft); color: #b45309; }
        .badge-new { background: var(--success-soft); color: var(--success); }
        .badge-deleted { background: var(--gray-100); color: var(--text-tertiary); }

        @media (max-width: 768px) { .content { padding: 20px; } }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-logo" id="brandLogo">J</div>
            <div class="brand-info">
                <div class="brand-title">📜 작업 로그</div>
                <div class="brand-sub">[3] 폴더 파일 변경 이력 · 작업 상태 기록</div>
            </div>
        </div>
        <div class="hbtns">
            <a class="ghost-btn" href="./menu.html">← 메뉴로</a>
        </div>
    </header>

    <main class="content">
        <div class="page-header">
            <div>
                <h1 class="page-title">📜 작업 로그</h1>
                <p class="page-subtitle">[3] 폴더 안 파일들의 생성·수정 시각을 기준으로 정리한 작업 이력입니다.</p>
            </div>
            <div class="snapshot-note">
                ⓘ 이 로그는 <strong id="snapshotDate">-</strong> 기준 스냅샷입니다. 실시간으로 폴더를 다시 읽어오지 않으므로, 이후 작업을 추가하려면 이 파일(log.html) 상단의 LOG_ENTRIES 목록에 새 항목을 넣어주세요. 셸(menu.html)은 건드릴 필요 없습니다.
            </div>
        </div>

        <div class="card">
            <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                <span>전체 이력 (최신순) — <span id="logCountLabel"></span></span>
                <input type="text" id="logSearchInput" placeholder="제목·설명·파일명 검색" style="padding:6px 10px;border:1px solid var(--border,#d7dee4);border-radius:8px;font-size:12.5px;min-width:220px;" oninput="onLogSearch(this.value)">
            </div>
            <div id="logRoot"></div>
            <div id="logMoreWrap" style="text-align:center;margin-top:14px;"></div>
        </div>
    </main>

    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = './index.html'; }

        // ===== 로그 항목 =====
        // 새 작업을 했으면 이 배열 맨 위에 항목을 추가하세요. (date, time은 실제 파일 저장 시각 기준)
        // unused: true 로 표시된 항목은 "만들었지만 현재 메뉴에 연결되어 있지 않은 파일"입니다.
        // deleted: true 로 표시된 항목은 실제로 폴더에서 삭제되어 더 이상 존재하지 않는 파일입니다.
        const LOG_ENTRIES = [
            {
                date: '2026-09-22', time: '10:15', badge: 'new',
                title: '데모 제작에 표준 모듈 2종(HA 기준정보·HB 회계) 신규 추가 + 기존 BE/BH/BI/BJ를 HC~HF로 재배치',
                desc: `사용자 요청: "데모 제작에 1,2번 추천해줘 기준정보와 회계같은". 기존 "데모 제작" 카테고리는 유통/보세창고운영/무역/식품제조 4개 업종별 실동작 데모(BE/BH/BI/BJ)만 있었는데, 특정 업종에 종속되지 않는 "표준 모듈"이 빠져 있다는 문제 제기 — 벤더 3사(Odoo/K-System/MS Dynamics) 견적서에도 "기준정보/데이터마이그레이션"과 "회계/재무관리"가 별도 구축 단계로 명시돼 있어, 자체개발이 이 영역을 못 보여주면 벤더 비교에서 약점이 될 수 있다는 점도 근거로 확인함.

사용자와 논의 후 확정된 방향: 기준정보·회계는 지금 당장 4개 업종 데모에 실시간 연동시키지 않고, 각자 독립적이고 표준화된 모듈로 만들어서 "나중에 실제 업체에 적용할 때 유통업체 = HA(기준정보)+HB(회계)+HC(유통) 처럼 표준모듈+업종모듈을 조합하는 마이그레이션을 테스트할 수 있는 상태"로 둔다(2026-09-19 모듈화 분석 문서의 B안 — 스키마 독립 유지 + 코드자산 표준화 — 의 연장선, 이번엔 "기준모듈↔업종모듈" 간 표준 인터페이스라는 점이 새로움).

코드 배정 과정에서 사용자가 처음 "데모 제작에 C 코드를 주자"고 제안했으나, C는 이미 일정관리(CA~CE)가 쓰고 있어 충돌함을 확인 — 전체 카테고리 문자를 재배정하는 대규모 방안(B안, 34개 파일 전부 리네임)과 데모 제작만 새 문자를 쓰는 소규모 방안(A안) 중 A안을 사용자가 선택. 데모 제작 전용 코드 문자로 <b>H</b>를 새로 배정.

**구현**: (1) 기존 BE-pilot3.html/BH-pilot4.html/BI-pilot5.html/BJ-pilot6.html을 각각 HC-pilot3.html/HD-pilot4.html/HE-pilot5.html/HF-pilot6.html로 복사(원본은 참고용으로 보존, BB/BC/BD와 동일한 관례). 페이지 본문 안의 "파일럿3(BE·유통)" 같은 상호 코드 언급 텍스트도 HC/HD로 갱신. docPrefix('BI'/'BO'/'GR'/'GI' 등 인쇄 전표번호 접두사)는 사이트 코드와 무관한 별도 네임스페이스임을 확인하고 건드리지 않음. Supabase 테이블 접두사(p3_~p6_)도 코드와 무관하므로 그대로 유지. (2) menu.html의 CATEGORIES 'demo' 카테고리에 HA/HB를 HC 앞에 추가하고 BE/BH/BI/BJ 항목을 HC/HD/HE/HF로 갱신. (3) 신규 <b>HA-기준정보.html</b>(거래처·품목·공통코드 관리, mst_ 테이블) — 레거시 JAEHO DB 분석(2026-09-20)에서 확인된 "정본 테이블 없이 백업본만 쌓이던" 문제에 대한 답으로 설계, partner_code/item_code 중복 등록을 막는 검증이 핵심 기능. (4) 신규 <b>HB-회계.html</b>(계정과목·분개·총계정원장·시산표, acc_ 테이블) — 표준 분개 인터페이스 RPC <code>acc_post_entry()</code>를 정의해 차변/대변 합계 일치를 서버에서 검증(복식부기 핵심 규칙), 향후 업종모듈의 확정 전표가 이 인터페이스를 호출하도록 붙이면 실연동이 가능한 구조. 둘 다 기존 HC-pilot3.html과 동일한 UI 스타일(:root 변수·카드·탭·뱃지)과 관리자 인증 패턴(RPC에 p_admin_username/p_admin_password 전달, 서버에서 users 테이블로 검증)을 그대로 재사용. (5) GC-layout.html 구조도의 CAT_DEMO subgraph에 HA/HB 노드 추가, P3~P6 라벨을 HC~HF로 갱신, "현재 상태" 카드 설명 문구도 총 36개 코드 기준으로 갱신.

node --check 문법 검증(menu.html·GC-layout.html·HA-기준정보.html·HB-회계.html 전부) + div/table/tr/td 태그 균형 검사 + GC-layout.html Mermaid 구조 검증(subgraph/end 쌍 8/8, 노드 ID 39개 전부 고유, SHELL 엣지 8개) + menu.html getCategoryItems() 함수 테스트(demo 카테고리 6개 항목, 중복 key 없음) 전부 통과. SQL(data/master_data_migration.sql, data/accounting_migration.sql)은 Supabase 접근이 막혀 있어 실제 실행 검증은 못 했고, $$ 블록 짝·괄호 짝·함수 개수 대 인증체크 개수 일치를 육안 검증함 — <b>사용자가 Supabase SQL Editor에서 직접 실행해야 함(아직 미실행)</b>.`,
                files: ['menu.html', 'GC-layout.html', 'HA-기준정보.html', 'HB-회계.html', 'data/master_data_migration.sql', 'data/accounting_migration.sql', 'HC-pilot3.html', 'HD-pilot4.html', 'HE-pilot5.html', 'HF-pilot6.html']
            },
            {
                date: '2026-09-22', time: '09:30', badge: 'new',
                title: '도입평가 사이드 메뉴를 "도입 평가"와 "데모 제작" 두 카테고리로 분리',
                desc: `사용자 요청: "도입평가 사이드를 메뉴를 구분해서 도입평가+하위, 데모 제작+하위 그렇게 나누어줘". 기존엔 도입평가(evaluation) 카테고리 하나에 점수·비교용 화면(BA 종합비교, BG 잔존가치분석, BC/BD 파일럿1·2 자리예약, BF 동적 프로그램별 상세)과 실제로 동작하는 4개 사업군 가상 ERP 데모(BE 유통, BH 보세창고운영, BI 무역, BJ 식품제조)가 함께 섞여 있었음 — 성격이 다른 두 그룹(평가·비교 도구 vs 실동작 체험 데모)이 사이드 하나에 묶여 있어 사용자가 구분을 요청.

수정(menu.html): CATEGORIES 배열의 기존 'evaluation' 카테고리에서 BE/BH/BI/BJ 4개 항목을 떼어내 새 최상위 카테고리 'demo'(🏭 데모 제작)로 옮김. 'evaluation' 카테고리에는 BA/BG/BC/BD(고정 4개)+BF(동적, 프로그램 추가 시 자동 생성)만 남음. 이 작업의 부수 효과로, 기존에 BE~BJ가 'evaluation' 카테고리 끝에 고정 배치돼 있어서 동적 BF 항목들을 그 "사이"에 끼워 넣기 위해 배열 인덱스(cat.items[0]~[7])를 하드코딩해야 했던 getCategoryItems() 함수를 [...cat.items, ...dynamicItems] 형태로 단순화함 — 이 하드코딩 인덱스 패턴은 실제로 이전에(2026-09-22 06:25 로그 참고) 항목이 조용히 사라지는 회귀 버그를 낸 적이 있는 취약한 패턴이었는데, BE~BJ가 다른 카테고리로 옮겨지면서 더 이상 인덱스를 손으로 맞출 필요가 없어져 그 버그 유형 자체가 원천적으로 사라짐.

운영지침.md 3-1절 "상호참조 파일 동기화" 규칙에 따라 menu.html의 CATEGORIES를 바꿨으므로 GC-layout.html 구조도도 함께 갱신: CAT_EVAL subgraph에서 P3~P6(BE/BH/BI/BJ) 노드를 빼서 새 CAT_DEMO["🏭 데모 제작"] subgraph로 옮기고, SHELL→CAT_DEMO 엣지를 추가(SHELL에서 뻗는 카테고리 엣지 7→8개). "현재 상태"·"참고" 카드 설명 문구도 8개 카테고리 기준으로 갱신.

node --check 문법 검증(menu.html·GC-layout.html 모두) + div 태그 균형 검사(GC-layout.html 19/19, menu.html 기존과 동일) + Node 함수 단위 테스트(CATEGORIES·getCategoryItems를 실제 파일에서 추출해 8개 카테고리 전부 실행, 중복 key 없음 확인 — evaluation 7개/demo 4개 정상 분리) + GC-layout.html Mermaid 구조 검증(subgraph/end 쌍 8/8, 노드 ID 37개 전부 고유, SHELL 엣지 8개) 전부 통과.`,
                files: ['menu.html', 'GC-layout.html']
            },
            {

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function badgeHTML(entry) {
            if (entry.unused) return '<span class="badge-inline badge-unused">미사용</span>';
            if (entry.badge === 'new') return '<span class="badge-inline badge-new">신규</span>';
            if (entry.badge === 'fix') return '<span class="badge-inline badge-fix">수정</span>';
            if (entry.badge === 'deleted') return '<span class="badge-inline badge-deleted">삭제</span>';
            return '';
        }

        // "이전 기록 더보기"로 필요할 때만 이어서 불러온다. 검색 중엔 전체에서 필터링.
        const LOG_PAGE_SIZE = 20;
        let logSearchTerm = '';
        let logShownCount = LOG_PAGE_SIZE;

        function esc2(s) { return esc(String(s == null ? '' : s)); }

        function matchesSearch(e, term) {
            if (!term) return true;
            const hay = [e.title, e.desc, ...(e.files || [])].join(' ').toLowerCase();
            return hay.includes(term);
        }

        function renderLog() {
            const root = document.getElementById('logRoot');
            const moreWrap = document.getElementById('logMoreWrap');
            const countLabel = document.getElementById('logCountLabel');
            const term = logSearchTerm.trim().toLowerCase();

            const filtered = term ? LOG_ENTRIES.filter(e => matchesSearch(e, term)) : LOG_ENTRIES;
            const visible = term ? filtered : filtered.slice(0, logShownCount);

            let html = '';
            let lastDate = null;
            visible.forEach((e) => {
                if (e.date !== lastDate) {
                    html += `<div class="day-divider"><span class="label">${esc(e.date)}</span><span class="line"></span></div>`;
                    lastDate = e.date;
                }
                const filesHTML = e.files.map(f => `<span class="file-chip${e.filesUnused ? ' unused' : ''}">${esc(f)}</span>`).join('');
                html += `
                    <div class="log-item">
                        <div class="log-dot${e.unused ? ' unused' : ''}"></div>
                        <div class="log-head">
                            <span class="log-time">${esc(e.time)}</span>
                        </div>
                        <div class="log-title">${esc(e.title)}${badgeHTML(e)}</div>
                        <div class="log-desc">${e.desc}</div>
                        <div class="log-files">${filesHTML}</div>
                    </div>`;
            });
            root.innerHTML = html || `<div style="padding:24px;text-align:center;color:var(--text-tertiary,#94a3b8);">검색 결과가 없습니다.</div>`;

            countLabel.textContent = term
                ? `검색결과 ${filtered.length}건 / 전체 ${LOG_ENTRIES.length}건`
                : `${visible.length} / 전체 ${LOG_ENTRIES.length}건 표시 중`;

            if (!term && filtered.length > logShownCount) {
                moreWrap.innerHTML = `<button type="button" class="ghost-btn" style="cursor:pointer;" onclick="loadMoreLog()">이전 기록 더보기 (${filtered.length - logShownCount}건 남음)</button>`;
            } else {
                moreWrap.innerHTML = '';
            }
        }
        function loadMoreLog() { logShownCount += LOG_PAGE_SIZE; renderLog(); }
        function onLogSearch(v) { logSearchTerm = v; renderLog(); }
        renderLog();

            A: { 'header-bg':'#0b1830', 'header-text':'#f4ede0', 'header-border':'#0b1830', 'header-border-width':'1px', 'header-btn-border':'rgba(255,255,255,0.3)', 'header-btn-hover-bg':'rgba(255,255,255,0.12)', 'logo-bg':'#c9a227', 'logo-text':'#0b1830' },
            B: { 'header-bg':'#ffffff', 'header-text':'#1e293b', 'header-border':'#e2e8f0', 'header-border-width':'1px', 'header-btn-border':'#e2e8f0', 'header-btn-hover-bg':'#f1f5f9', 'logo-bg':'#2563eb', 'logo-text':'#ffffff' },
            C: { 'header-bg':'#ffffff', 'header-text':'#16324f', 'header-border':'#16324f', 'header-border-width':'2px', 'header-btn-border':'#d7dee4', 'header-btn-hover-bg':'#f2f5f7', 'logo-bg':'#16324f', 'logo-text':'#ffffff' },
        };
        function applyHeaderTheme(key){
            const t = HEADER_THEMES[key] || HEADER_THEMES.C;
            Object.entries(t).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));
        }
        applyHeaderTheme(localStorage.getItem('dashTheme') || 'C');
        window.addEventListener('storage', (e) => { if (e.key === 'dashTheme') applyHeaderTheme(e.newValue || 'C'); });
    </script>
</body>
