<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23534AB7%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial,sans-serif%27 font-size=%2718%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EJ%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유저 관리 - JAEHO ERP Suite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --primary:#534AB7; --secondary:#6366f1; --bg:#f7f8fc; --text:#1f2937; --text-light:#6b7280; --border:#e5e7eb; }
  body{font-family:'IBM Plex Sans KR','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{
    background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);color:#fff;
    padding:22px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  .brand{font-size:17px;font-weight:700;}
  .brand-sub{font-size:12px;opacity:0.85;}
  .hbtns a, .hbtns button{
    background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;
    padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;text-decoration:none;
  }
  .hbtns a:hover, .hbtns button:hover{background:rgba(255,255,255,0.28);}

  main{max-width:980px;margin:0 auto;padding:32px 24px 60px;}
  .denied{max-width:480px;margin:80px auto;text-align:center;color:var(--text-light);}

  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;font-family:inherit;cursor:pointer;color:var(--text-light);}
  .tab.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
  .view{display:none;}
  .view.on{display:block;}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
  th, td{padding:11px 13px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--border);}
  th{background:#fafafa;color:var(--text-light);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:#fafbff;}
  .role-tag, .status-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;}
  .role-admin{background:#ede9fe;color:#5b21b6;}
  .role-user{background:#f1f5f9;color:#475569;}
  .status-active{background:#dcfce7;color:#166534;}
  .status-blocked{background:#fee2e2;color:#991b1b;}
  .status-delete_pending{background:#fef3c7;color:#92400e;}
  .count{font-weight:700;color:var(--primary);}
  .refresh-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .refresh-bar button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .empty{text-align:center;padding:40px;color:var(--text-light);font-size:13px;}

  /* 설정 탭 */
  .settings-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px;}
  .settings-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .settings-label{font-size:13px;font-weight:600;}
  .settings-desc{font-size:11.5px;color:var(--text-light);margin-top:2px;}
  .settings-row input[type=number]{width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;}
  .settings-row input[type=text]{width:80px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;text-transform:uppercase;}
  .switch{position:relative;width:42px;height:24px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#ddd;border-radius:24px;transition:.2s;}
  .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--primary);}
  input:checked + .slider::before{transform:translateX(18px);}
  .save-hint{font-size:11px;color:var(--text-light);margin-top:10px;}

  /* 모달 */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-head .mtitle{font-size:15px;font-weight:700;}
  .modal-close{border:none;background:transparent;font-size:16px;cursor:pointer;color:var(--text-light);}
  .modal-body{padding:20px 22px;}
  .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f1f1;font-size:12.5px;}
  .detail-row .k{color:var(--text-light);}
  .detail-row .v{font-weight:600;}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;}
  .action-grid button{
    padding:10px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600;
  }
  .action-grid button:hover{background:#f9fafb;}
  .action-grid button.danger{color:#dc2626;border-color:#fecaca;}
  .action-grid button.danger:hover{background:#fef2f2;}
  .action-grid button.warn{color:#b45309;border-color:#fde68a;}
  .action-grid button.warn:hover{background:#fffbeb;}
  .action-grid button.full{grid-column:1/-1;}
  .pw-reveal{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px;margin-top:14px;font-size:12.5px;}
  .pw-reveal code{display:block;font-size:15px;font-weight:700;background:#fff;padding:8px 10px;border-radius:6px;margin:8px 0;border:1px solid #bbf7d0;letter-spacing:0.5px;}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">👥 유저 관리</div>
    <div class="brand-sub">유저 목록·정책 설정·감사기록을 관리합니다</div>
  </div>
  <div class="hbtns"><a href="./menu.html">← 메뉴로</a></div>
</header>

<main id="mainArea">
  <div class="tabs">
    <button id="tabUsers" class="tab on">👤 유저 목록</button>
    <button id="tabSettings" class="tab">⚙ 정책 설정</button>
    <button id="tabAudit" class="tab">📜 감사기록</button>
  </div>

  <div id="viewUsers" class="view on">
    <div class="refresh-bar">
      <div style="font-size:13px;color:var(--text-light);" id="summaryLine">불러오는 중...</div>
      <button onclick="loadUsers()">↻ 새로고침</button>
    </div>
    <div id="tableWrap"></div>
  </div>

  <div id="viewSettings" class="view">
    <div class="settings-card">
      <div class="settings-row">
        <div>
          <div class="settings-label">삭제 유예기간</div>
          <div class="settings-desc">계정 삭제 예약 후, 완전히 삭제되기까지 기다리는 기간입니다 (일 단위).</div>
        </div>
        <div><input type="number" id="setGraceDays" min="1" max="90"> 일</div>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">감사기록 남기기</div>
          <div class="settings-desc">로그인/가입/관리자 조치 등을 감사기록 탭에 남길지 여부입니다.</div>
        </div>
        <label class="switch"><input type="checkbox" id="setAuditEnabled"><span class="slider"></span></label>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">해외접속 차단</div>
          <div class="settings-desc">허용 국가 외 접속을 로그인 단계에서 막습니다. (클라이언트 조회 기반 — 억제책 수준입니다)</div>
        </div>
        <label class="switch"><input type="checkbox" id="setBlockForeign"><span class="slider"></span></label>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">허용 국가코드</div>
          <div class="settings-desc">ISO 국가코드 2자리 (예: KR)</div>
        </div>
        <div><input type="text" id="setAllowedCountry" maxlength="2"></div>
      </div>
      <button onclick="saveSettings()" style="margin-top:16px;width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">저장</button>
      <div class="save-hint" id="settingsMsg"></div>
    </div>
  </div>

  <div id="viewAudit" class="view">
    <div class="refresh-bar">
      <div style="font-size:13px;color:var(--text-light);" id="auditSummary">불러오는 중...</div>
      <button onclick="loadAuditLogs()">↻ 새로고침</button>
    </div>
    <div id="auditWrap"></div>
  </div>
</main>

<!-- 유저 상세 모달 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="mtitle" id="modalTitle">유저 상세</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = './index.html'; }

  const myRole = sessionStorage.getItem('role');
  const myUsername = sessionStorage.getItem('username');
  const myPw = sessionStorage.getItem('pw');
  const sb = getSupabase();

  if (myRole !== 'admin') {
    document.getElementById('mainArea').innerHTML = `
      <div class="denied">
        <div style="font-size:40px;margin-bottom:12px;">🔒</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:8px;">관리자만 접근할 수 있습니다.</div>
        <div style="font-size:13px;">현재 계정: ${myUsername || '-'} (일반 사용자)</div>
      </div>`;
  } else {
    loadUsers();
  }

  // ── 탭 전환 ──
  const tabs = { users: document.getElementById('tabUsers'), settings: document.getElementById('tabSettings'), audit: document.getElementById('tabAudit') };
  const views = { users: document.getElementById('viewUsers'), settings: document.getElementById('viewSettings'), audit: document.getElementById('viewAudit') };
  function switchTab(name){
    Object.keys(tabs).forEach(k=>{ tabs[k].classList.toggle('on', k===name); views[k].classList.toggle('on', k===name); });
    if (name==='settings') loadSettings();
    if (name==='audit') loadAuditLogs();
  }
  tabs.users.onclick = ()=>switchTab('users');
  tabs.settings.onclick = ()=>switchTab('settings');
  tabs.audit.onclick = ()=>switchTab('audit');

  function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtDate(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  const STATUS_LABEL = { active:'활성', blocked:'차단됨', delete_pending:'삭제예약' };

  // ── 유저 목록 ──
  let usersCache = [];
  async function loadUsers(){
    if (myRole !== 'admin') return;
    const wrap = document.getElementById('tableWrap');
    const summary = document.getElementById('summaryLine');
    if (!sb) { wrap.innerHTML = '<div class="empty">Supabase 설정이 필요합니다.</div>'; return; }

    try {
      const { data, error } = await sb.rpc('admin_list_users', { p_admin_username: myUsername, p_admin_password: myPw });
      if (error) throw error;
      usersCache = data || [];

      if (!usersCache.length) {
        wrap.innerHTML = '<div class="empty">등록된 유저가 없습니다.</div>';
        summary.textContent = '유저 0명';
        return;
      }

      summary.textContent = `유저 ${usersCache.length}명 · 총 로그인 ${usersCache.reduce((s,u)=>s+u.login_count,0)}회`;

      wrap.innerHTML = `
        <table>
          <thead><tr><th>아이디</th><th>역할</th><th>상태</th><th>로그인</th><th>가입일</th><th>마지막 로그인</th></tr></thead>
          <tbody>
            ${usersCache.map(u => `
              <tr class="clickable" onclick="openDetail('${esc(u.username)}')">
                <td>${esc(u.username)}</td>
                <td><span class="role-tag ${u.role==='admin'?'role-admin':'role-user'}">${u.role==='admin'?'관리자':'사용자'}</span></td>
                <td><span class="status-tag status-${u.status}">${STATUS_LABEL[u.status]||u.status}</span></td>
                <td class="count">${u.login_count}회</td>
                <td>${fmtDate(u.created_at)}</td>
                <td>${fmtDate(u.last_login)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      console.error(err);
      wrap.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
    }
  }

  // ── 유저 상세 모달 ──
  const backdrop = document.getElementById('modalBackdrop');
  function closeModal(){ backdrop.classList.remove('open'); }
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });

  async function openDetail(username){
    try {
      const { data, error } = await sb.rpc('admin_get_user_detail', {
        p_admin_username: myUsername, p_admin_password: myPw, p_target_username: username
      });
      if (error) throw error;
      if (!data.success) { alert(data.message||'조회 실패'); return; }
      renderDetail(data);
      backdrop.classList.add('open');
    } catch(err){ console.error(err); alert('상세 정보를 불러오지 못했습니다.'); }
  }

  function renderDetail(d){
    document.getElementById('modalTitle').textContent = d.username + ' 상세';
    const isSelf = d.username === myUsername;
    const isBlocked = d.status === 'blocked';
    const isPending = d.status === 'delete_pending';

    let deleteInfo = '';
    if (isPending) {
      deleteInfo = `<div class="detail-row"><span class="k">삭제 예정일</span><span class="v">${fmtDate(d.deleteAt)} (${d.remainingDays}일 남음)</span></div>`;
    }

    document.getElementById('modalBody').innerHTML = `
      <div class="detail-row"><span class="k">역할</span><span class="v">${d.role==='admin'?'관리자':'사용자'}</span></div>
      <div class="detail-row"><span class="k">상태</span><span class="v"><span class="status-tag status-${d.status}">${STATUS_LABEL[d.status]||d.status}</span></span></div>
      <div class="detail-row"><span class="k">가입일</span><span class="v">${fmtDate(d.createdAt)}</span></div>
      <div class="detail-row"><span class="k">누적 이용일수</span><span class="v">${d.daysAccumulated}일</span></div>
      <div class="detail-row"><span class="k">로그인 횟수</span><span class="v">${d.loginCount}회</span></div>
      <div class="detail-row"><span class="k">마지막 로그인</span><span class="v">${fmtDate(d.lastLogin)}</span></div>
      ${deleteInfo}
      <div id="pwRevealArea"></div>
      <div class="action-grid">
        <button onclick="doResetPassword('${esc(d.username)}')">🔑 비밀번호 초기화</button>
        <button onclick="doResetLoginCount('${esc(d.username)}')">↺ 로그인횟수 초기화</button>
        ${isSelf ? '' : `<button class="${isBlocked?'':'warn'}" onclick="doToggleBlock('${esc(d.username)}', ${!isBlocked})">${isBlocked?'🔓 차단 해제':'⛔ 계정 차단'}</button>`}
        ${isSelf ? '' : (isPending
          ? `<button onclick="doCancelDelete('${esc(d.username)}')">↩ 삭제예약 취소</button>`
          : `<button class="danger" onclick="doReserveDelete('${esc(d.username)}')">🗑 삭제 예약 (유예기간 후 삭제)</button>`)}
        ${isSelf ? '<div style="grid-column:1/-1;font-size:11px;color:var(--text-light);text-align:center;">본인 계정은 차단·삭제할 수 없습니다.</div>' : ''}
      </div>
    `;
  }

  async function doResetPassword(username){
    if(!confirm(`"${username}"의 비밀번호를 랜덤 값으로 초기화할까요?`)) return;
    try{
      const { data, error } = await sb.rpc('admin_reset_password', { p_admin_username: myUsername, p_admin_password: myPw, p_target_username: username });
      if(error) throw error;
      if(!data.success){ alert(data.message||'실패'); return; }
      document.getElementById('pwRevealArea').innerHTML = `
        <div class="pw-reveal">
          🔑 새 비밀번호가 생성되었습니다. <b>이 화면을 벗어나면 다시 볼 수 없으니</b> 신뢰할 수 있는 방법으로 본인에게 직접 전달해주세요.
          <code>${esc(data.newPassword)}</code>
        </div>`;
      loadUsers();
    }catch(err){ console.error(err); alert('처리 중 오류가 발생했습니다.'); }
  }

  async function doResetLoginCount(username){
    if(!confirm(`"${username}"의 로그인 횟수를 0으로 초기화할까요?`)) return;
    try{
      const { data, error } = await sb.rpc('admin_reset_login_count', { p_admin_username: myUsername, p_admin_password: myPw, p_target_username: username });
      if(error) throw error;
      if(!data.success){ alert(data.message||'실패'); return; }
      openDetail(username); loadUsers();
    }catch(err){ console.error(err); alert('처리 중 오류가 발생했습니다.'); }
  }

  async function doToggleBlock(username, block){
    if(!confirm(`"${username}" 계정을 ${block?'차단':'차단 해제'}할까요?`)) return;
    try{
      const { data, error } = await sb.rpc('admin_toggle_block', { p_admin_username: myUsername, p_admin_password: myPw, p_target_username: username, p_block: block });
      if(error) throw error;
      if(!data.success){ alert(data.message||'실패'); return; }
      openDetail(username); loadUsers();
    }catch(err){ console.error(err); alert('처리 중 오류가 발생했습니다.'); }
  }

  async function doReserveDelete(username){
    if(!confirm(`"${username}" 계정을 삭제 예약할까요?\n예약 즉시 로그인이 정지되고, 유예기간 후 완전히 삭제됩니다.`)) return;
    try{
      const { data, error } = await sb.rpc('admin_reserve_delete', { p_admin_username: myUsername, p_admin_password: myPw, p_target_username: username });
      if(error) throw error;
      if(!data.success){ alert(data.message||'실패'); return; }
      openDetail(username); loadUsers();
    }catch(err){ console.error(err); alert('처리 중 오류가 발생했습니다.'); }
  }

  async function doCancelDelete(username){
    if(!confirm(`"${username}"의 삭제 예약을 취소할까요?`)) return;
    try{
      const { data, error } = await sb.rpc('admin_cancel_delete', { p_admin_username: myUsername, p_admin_password: myPw, p_target_username: username });
      if(error) throw error;
      if(!data.success){ alert(data.message||'실패'); return; }
      openDetail(username); loadUsers();
    }catch(err){ console.error(err); alert('처리 중 오류가 발생했습니다.'); }
  }

  // ── 정책 설정 ──
  async function loadSettings(){
    try{
      const { data, error } = await sb.rpc('admin_get_settings', { p_admin_username: myUsername, p_admin_password: myPw });
      if(error) throw error;
      document.getElementById('setGraceDays').value = data.grace_period_days || 7;
      document.getElementById('setAuditEnabled').checked = data.audit_log_enabled === 'true';
      document.getElementById('setBlockForeign').checked = data.block_foreign_login === 'true';
      document.getElementById('setAllowedCountry').value = data.allowed_country || 'KR';
    }catch(err){ console.error(err); }
  }

  async function saveSettings(){
    const entries = [
      ['grace_period_days', String(Math.max(1, parseInt(document.getElementById('setGraceDays').value)||7))],
      ['audit_log_enabled', document.getElementById('setAuditEnabled').checked ? 'true' : 'false'],
      ['block_foreign_login', document.getElementById('setBlockForeign').checked ? 'true' : 'false'],
      ['allowed_country', (document.getElementById('setAllowedCountry').value||'KR').toUpperCase()]
    ];
    const msgEl = document.getElementById('settingsMsg');
    msgEl.textContent = '저장 중...';
    try{
      for (const [key, value] of entries) {
        const { data, error } = await sb.rpc('admin_update_setting', { p_admin_username: myUsername, p_admin_password: myPw, p_key: key, p_value: value });
        if(error) throw error;
        if(!data.success){ msgEl.textContent = data.message||'저장 실패'; return; }
      }
      msgEl.textContent = '✅ 저장되었습니다. 즉시 전체 시스템에 반영됩니다.';
    }catch(err){ console.error(err); msgEl.textContent = '저장 중 오류가 발생했습니다.'; }
  }

  // ── 감사기록 ──
  const ACTION_LABEL = {
    login_success:'로그인 성공', login_failed:'로그인 실패', login_blocked_account:'차단계정 로그인시도',
    login_blocked_delete_pending:'삭제예약계정 로그인시도', login_blocked_foreign:'해외접속 차단',
    register:'회원가입', set_role:'역할변경', password_reset:'비밀번호초기화',
    block:'계정차단', unblock:'차단해제', reserve_delete:'삭제예약', cancel_delete:'삭제예약취소',
    reset_login_count:'로그인횟수초기화', update_setting:'정책설정변경'
  };
  async function loadAuditLogs(){
    const wrap = document.getElementById('auditWrap');
    const summary = document.getElementById('auditSummary');
    try{
      const { data, error } = await sb.rpc('admin_list_audit_logs', { p_admin_username: myUsername, p_admin_password: myPw, p_limit: 200 });
      if(error) throw error;
      if(!data || !data.length){ wrap.innerHTML = '<div class="empty">기록이 없습니다.</div>'; summary.textContent='기록 0건'; return; }
      summary.textContent = `최근 ${data.length}건`;
      wrap.innerHTML = `
        <table>
          <thead><tr><th>시각</th><th>동작</th><th>대상</th><th>관리자</th><th>IP</th><th>기기</th><th>브라우저</th></tr></thead>
          <tbody>
            ${data.map(l => `
              <tr>
                <td>${fmtDate(l.occurred_at)}</td>
                <td>${esc(ACTION_LABEL[l.action]||l.action)}</td>
                <td>${esc(l.target_username||'-')}</td>
                <td>${esc(l.admin_username||'-')}</td>
                <td>${esc(l.ip||'-')}</td>
                <td>${esc(l.device||'-')}</td>
                <td>${esc(l.browser||'-')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }catch(err){ console.error(err); wrap.innerHTML = '<div class="empty">기록을 불러오지 못했습니다.</div>'; }
  }
</script>
</body>
</html>
