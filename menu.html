<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAEHO ERP Suite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --primary:#534AB7;
    --secondary:#6366f1;
    --bg:#f7f8fc;
    --card-bg:#ffffff;
    --text:#1f2937;
    --text-light:#6b7280;
    --border:#e5e7eb;
  }

  body{
    font-family:'IBM Plex Sans KR','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    min-height:100vh;
    color:var(--text);
  }

  header{
    background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);
    color:#fff;
    padding:28px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 20px rgba(83,74,183,0.25);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{
    width:44px;height:44px;background:rgba(255,255,255,0.15);
    border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:20px;backdrop-filter:blur(4px);
  }
  .brand-title{font-size:19px;font-weight:700;letter-spacing:-0.3px;}
  .brand-sub{font-size:12px;opacity:0.85;margin-top:2px;}

  .user-area{display:flex;align-items:center;gap:10px;font-size:13px;}
  .user-chip{
    background:rgba(255,255,255,0.15);
    padding:7px 14px;border-radius:20px;
    display:flex;align-items:center;gap:6px;
  }
  .icon-btn, .logout-btn{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;padding:8px 14px;border-radius:8px;
    cursor:pointer;font-size:12px;font-family:inherit;
    transition:all 0.2s; text-decoration:none; display:inline-flex; align-items:center; gap:5px;
  }
  .icon-btn:hover, .logout-btn:hover{background:rgba(255,255,255,0.28);}

  main{max-width:1100px;margin:0 auto;padding:48px 40px 80px;}
  .section-title{font-size:22px;font-weight:700;margin-bottom:6px;}
  .section-desc{font-size:14px;color:var(--text-light);margin-bottom:36px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:28px 24px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    display:flex;flex-direction:column;
    min-height:210px;
  }
  .card::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:4px;
    background:var(--card-accent, var(--primary));
  }
  .card:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 36px rgba(83,74,183,0.14);
    border-color:transparent;
  }
  .card-step{
    font-size:11px;font-weight:700;color:var(--card-accent, var(--primary));
    letter-spacing:0.5px;margin-bottom:10px;
  }
  .card-icon{
    width:46px;height:46px;border-radius:12px;
    background:var(--card-accent-soft, #ede9fe);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;margin-bottom:14px;
  }
  .card-title{font-size:17px;font-weight:700;margin-bottom:8px;}
  .card-title-en{font-size:11px;color:var(--text-light);font-weight:500;margin-bottom:10px;}
  .card-desc{font-size:13px;color:var(--text-light);line-height:1.55;flex:1;}
  .card-cta{
    margin-top:16px;font-size:13px;font-weight:600;
    color:var(--card-accent, var(--primary));
    display:flex;align-items:center;gap:4px;
  }
  .card.disabled{opacity:0.55;cursor:not-allowed;}
  .card.disabled:hover{transform:none;box-shadow:none;border-color:var(--border);}
  .badge-soon{
    position:absolute;top:16px;right:16px;
    background:#f3f4f6;color:var(--text-light);
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;
  }
  footer{ text-align:center;padding:24px;color:var(--text-light);font-size:12px; }

  @media (max-width:640px){
    header{padding:20px;flex-wrap:wrap;gap:12px;}
    main{padding:32px 20px 60px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo" id="brandLogo">J</div>
    <div>
      <div class="brand-title" id="siteTitle">JAEHO ERP Suite</div>
      <div class="brand-sub" id="siteSubtitle">ERP 도입 사전단계 통합 플랫폼</div>
    </div>
  </div>
  <div class="user-area">
    <div class="user-chip">👤 <span id="username">-</span><span id="roleBadge" style="display:none;font-size:10px;background:rgba(255,255,255,0.25);padding:2px 7px;border-radius:10px;margin-left:2px;">관리자</span></div>
    <a class="icon-btn" id="userMgmtBtn" href="./users.html" style="display:none;" title="유저 관리">👥 유저 관리</a>
    <a class="icon-btn" href="./settings.html" title="메뉴 항목 설정">⚙ 설정</a>
    <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
  </div>
</header>

<main>
  <div class="section-title">도구를 선택하세요</div>
  <div class="section-desc">ERP 도입 전 단계별 설계·시뮬레이션 도구와 공유 문서입니다.</div>

  <div class="grid" id="toolGrid"><div style="color:#9ca3af;font-size:13px;">불러오는 중...</div></div>
</main>

<footer>© 2026 JAEHO ERP Lab</footer>

<script>
  if (sessionStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = './index.html';
  }
  const username = sessionStorage.getItem('username');
  if (username) document.getElementById('username').textContent = username;
  const role = sessionStorage.getItem('role');
  if (role === 'admin') {
    document.getElementById('roleBadge').style.display = 'inline-block';
    document.getElementById('userMgmtBtn').style.display = 'inline-flex';
  }

  function handleLogout() {
    if (confirm('로그아웃하시겠습니까?')) {
      sessionStorage.removeItem('isLoggedIn');
      sessionStorage.removeItem('username');
      sessionStorage.removeItem('loginTime');
      sessionStorage.removeItem('role');
      sessionStorage.removeItem('pw');
      sessionStorage.removeItem('loginCount');
      window.location.href = './index.html';
    }
  }

  function hexToSoft(hex){
    try{
      const h = hex.replace('#','');
      const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
      const mix = (c)=>Math.round(c + (255-c)*0.86);
      return 'rgb('+mix(r)+','+mix(g)+','+mix(b)+')';
    }catch(e){ return '#ede9fe'; }
  }

  async function loadConfig(){
    // menu.html은 언제나 GitHub에 커밋된 data/menuConfig.json만 읽습니다.
    // (편집 중인 초안은 settings.html 안에서만 미리보기하며, 여기엔 영향을 주지 않습니다)
    let config = { siteTitle:'JAEHO ERP Suite', siteSubtitle:'ERP 도입 사전단계 통합 플랫폼', items:[] };
    try {
      const res = await fetch('./data/menuConfig.json', {cache:'no-store'});
      if (res.ok) config = await res.json();
      else console.warn('menuConfig.json 응답 오류:', res.status);
    } catch(e) {
      console.warn('menuConfig.json 로드 실패', e);
    }

    document.getElementById('siteTitle').textContent = config.siteTitle || 'JAEHO ERP Suite';
    document.getElementById('siteSubtitle').textContent = config.siteSubtitle || '';

    renderTools(config.items || []);
  }

  function renderTools(items) {
    const grid = document.getElementById('toolGrid');
    grid.innerHTML = '';
    if (!items.length) {
      grid.innerHTML = '<div style="color:#9ca3af;font-size:13px;">등록된 항목이 없습니다. 우측 상단 "⚙ 설정"에서 추가하세요.</div>';
      return;
    }
    items.forEach(t => {
      const enabled = t.enabled !== false;
      const card = document.createElement('div');
      card.className = 'card' + (enabled ? '' : ' disabled');
      card.style.setProperty('--card-accent', t.color || '#534AB7');
      card.style.setProperty('--card-accent-soft', hexToSoft(t.color || '#534AB7'));
      card.innerHTML = `
        ${!enabled ? '<div class="badge-soon">준비중</div>' : ''}
        <div class="card-step">${t.category || ''}</div>
        <div class="card-icon">${t.icon || '📄'}</div>
        <div class="card-title">${t.titleKo || ''}</div>
        <div class="card-title-en">${t.titleEn || ''}</div>
        <div class="card-desc">${t.desc || ''}</div>
        <div class="card-cta">${enabled ? '시작하기 →' : '준비 중입니다'}</div>
      `;
      if (enabled && t.link) {
        card.addEventListener('click', () => {
          const isExternal = /^https?:\/\//i.test(t.link);
          if (isExternal) window.open(t.link, '_blank');
          else window.location.href = t.link;
        });
      }
      grid.appendChild(card);
    });
  }

  loadConfig();
</script>
</body>
</html>
