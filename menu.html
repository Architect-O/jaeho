<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAEHO ERP Suite - 구축 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        /* 브랜드/테마 (JS applyTheme()이 런타임에 덮어씁니다. 기본값 = C. 컨설팅 클린) */
        --header-bg: #ffffff;
        --header-text: #16324f;
        --header-border: #16324f;
        --header-border-width: 2px;
        --header-btn-border: #d7dee4;
        --header-btn-hover-bg: #f2f5f7;
        --logo-bg: #16324f;
        --logo-text: #ffffff;
        --sidebar-bg: #fbfcfd;
        --sidebar-text: #45566a;
        --sidebar-title: #93a2ae;
        --sidebar-hover-bg: #f0f1f3;
        --sidebar-active-bg: #eef2f5;
        --sidebar-active-text: #16324f;
        --sidebar-active-border: #b8860b;
        --accent: #16324f;
        --cat-active-bg: #eef2f5;
        --cat-active-text: #16324f;

        /* 공통 콘텐츠 영역 */
        --content-bg: #ffffff;
        --card-bg: #ffffff;
        --text: #1f2328;
        --text-secondary: #6b7280;
        --text-tertiary: #9ca3af;
        --border: #e8eaed;
        --success: #10b981;
        --success-soft: #ecfdf5;
        --warning: #f59e0b;
        --warning-soft: #fffbeb;
        --danger: #ef4444;
        --danger-soft: #fef2f2;
        --info: #3b82f6;
        --info-soft: #eff6ff;
    }

    body {
        font-family: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--content-bg);
        color: var(--text);
        min-height: 100vh;
    }

    a { color: inherit; }

    /* ===== Header ===== */
    header {
        height: 56px;
        background: var(--header-bg);
        color: var(--header-text);
        border-bottom: var(--header-border-width) solid var(--header-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        position: sticky;
        top: 0;
        z-index: 300;
        transition: background .2s, color .2s, border-color .2s;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand-logo {
        width: 28px; height: 28px;
        background: var(--logo-bg);
        border-radius: 7px;
        display: flex; align-items: center; justify-content: center;
        color: var(--logo-text); font-weight: 700; font-size: 13px;
        overflow: hidden; flex-shrink: 0;
    }
    .brand-logo img, .brand-logo svg { width: 100%; height: 100%; object-fit: cover; }

    .brand-info { display: flex; flex-direction: column; line-height: 1.25; }
    .brand-title { font-size: 14px; font-weight: 600; color: var(--header-text); }
    .brand-sub { font-size: 11px; color: var(--header-text); opacity: 0.65; }

    .user-area { display: flex; align-items: center; gap: 8px; }

    .user-chip {
        display: flex; align-items: center; gap: 6px;
        font-size: 12.5px; color: var(--header-text); opacity: 0.85;
        padding: 5px 10px; border-radius: 6px;
            white-space: nowrap;
    }
    .role-badge {
        display: none; font-size: 10px; font-weight: 600;
        background: var(--cat-active-bg); color: var(--cat-active-text);
        padding: 2px 7px; border-radius: 10px; margin-left: 2px; opacity: 1;
            white-space: nowrap;
    }

    .ghost-btn {white-space:nowrap;
        background: transparent; border: 1px solid var(--header-btn-border);
        color: var(--header-text); padding: 6px 12px; border-radius: 6px;
        font-size: 12px; font-family: inherit; cursor: pointer;
        text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
        transition: all .15s;
    }
    .ghost-btn:hover { background: var(--header-btn-hover-bg); }

    /* ===== Category bar ===== */
    .category-bar {
        display: flex; gap: 4px; align-items: center;
        padding: 8px 20px; background: var(--content-bg);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        position: sticky; top: 56px; z-index: 250;
    }
    .cat-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 7px 12px; border-radius: 7px; border: none; background: transparent;
        color: var(--text-secondary); font-size: 13px; font-family: inherit;
        cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .cat-btn:hover { background: var(--sidebar-hover-bg); color: var(--text); }
    .cat-btn.active { background: var(--cat-active-bg); color: var(--cat-active-text); font-weight: 600; }

    /* ===== Body layout ===== */
    .app-body { display: flex; align-items: flex-start; }

    .sidebar {
        width: 232px; flex-shrink: 0;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        padding: 16px 0 40px;
        position: sticky; top: 101px;
        height: calc(100vh - 101px);
        overflow-y: auto;
        transition: background .2s;
    }
    .sb-section { margin-bottom: 22px; }
    .sb-section-title {
        padding: 6px 20px; font-size: 10.5px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .5px; color: var(--sidebar-title);
    }
    .sb-menu { list-style: none; padding: 0 8px; }
    .sb-menu li { margin: 1px 0; }
    .sb-menu a {
        display: flex; align-items: center; gap: 9px;
        padding: 7px 12px; border-radius: 6px;
        font-size: 13px; color: var(--sidebar-text); text-decoration: none;
        transition: all .15s;
    }
    .sb-menu a:hover { background: var(--sidebar-hover-bg); }
    .sb-menu a.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); font-weight: 600; border-left: 2px solid var(--sidebar-active-border); padding-left: 10px; }
    .icon-svg { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; flex-shrink: 0; }
    .sb-icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* ===== 아이콘 스타일 칩 시스템 (설정 > 아이콘 스타일에서 전환 가능, 2026-09-23) =====
       사이드바 항목·큰 안내 아이콘은 .icon-chip 으로 감싸 렌더링되고, <html data-icon-style="..."> 값에 따라
       칩의 배경·아이콘 색이 통째로 바뀐다. 카테고리 tab바·페이지 제목 등 좁은 자리는 칩 없이 기존 라인 아이콘을 그대로 쓴다. */
    .icon-chip { display:inline-flex; align-items:center; justify-content:center; border-radius:10px; flex-shrink:0; position:relative; box-sizing:border-box; }
    .icon-chip .icon-svg { width:60%; height:60%; }
    .sb-icon-chip { width:32px; height:32px; }
    .hero-icon-chip { width:56px; height:56px; border-radius:14px; }

    /* 카테고리별 색상(hue) — CATEGORIES의 8개 최상위 key와 1:1 대응. hue가 없으면(헤더 등) 아래 기본값(system 톤) 사용 */
    :root { --hue:#64748b; --hue-from:#94a3b8; --hue-to:#475569; --hue-bg:#f8fafc; --hue-fg:#334155; }
    .icon-chip[data-hue="dashboard"]    { --hue:#6366f1; --hue-from:#818cf8; --hue-to:#4f46e5; --hue-bg:#eef2ff; --hue-fg:#4338ca; }
    .icon-chip[data-hue="evaluation"]   { --hue:#8b5cf6; --hue-from:#a78bfa; --hue-to:#7c3aed; --hue-bg:#f5f3ff; --hue-fg:#6d28d9; }
    .icon-chip[data-hue="demo"]         { --hue:#f59e0b; --hue-from:#fbbf24; --hue-to:#d97706; --hue-bg:#fffbeb; --hue-fg:#b45309; }
    .icon-chip[data-hue="schedule"]     { --hue:#0ea5e9; --hue-from:#38bdf8; --hue-to:#0284c7; --hue-bg:#f0f9ff; --hue-fg:#0369a1; }
    .icon-chip[data-hue="lessons"]      { --hue:#f43f5e; --hue-from:#fb7185; --hue-to:#e11d48; --hue-bg:#fff1f2; --hue-fg:#be123c; }
    .icon-chip[data-hue="architecture"] { --hue:#f97316; --hue-from:#fb923c; --hue-to:#ea580c; --hue-bg:#fff7ed; --hue-fg:#c2410c; }
    .icon-chip[data-hue="reports"]      { --hue:#10b981; --hue-from:#34d399; --hue-to:#059669; --hue-bg:#ecfdf5; --hue-fg:#047857; }
    .icon-chip[data-hue="system"]       { --hue:#64748b; --hue-from:#94a3b8; --hue-to:#475569; --hue-bg:#f8fafc; --hue-fg:#334155; }

    /* A. 그라디언트 듀오톤 (Stripe·Linear 감성) */
    [data-icon-style="gradient"] .icon-chip { background:linear-gradient(135deg,var(--hue-from),var(--hue-to)); box-shadow:0 4px 10px -3px var(--hue); }
    [data-icon-style="gradient"] .icon-chip .icon-svg { stroke:#ffffff; }
    /* B. 플랫 파스텔 (Notion·Superhuman 감성) */
    [data-icon-style="pastel"] .icon-chip { background:var(--hue-bg); }
    [data-icon-style="pastel"] .icon-chip .icon-svg { stroke:var(--hue-fg); }
    /* C. 소프트 셰도우/글래스 (Vercel·Linear 감성) — 색 없이 그림자만 */
    [data-icon-style="glass"] .icon-chip { background:#ffffff; border:1px solid rgba(15,23,42,0.08); box-shadow:0 1px 2px rgba(15,23,42,0.05), 0 8px 18px -8px rgba(15,23,42,0.2); }
    [data-icon-style="glass"] .icon-chip .icon-svg { stroke:#1e293b; }
    /* D. 미니멀 라인 (기본값) — 배경 없이 선만, 별도 규칙 없이 자연스러운 투명 기본값 사용 */
    [data-icon-style="minimal"] .icon-chip .icon-svg { stroke:currentColor; }
    /* E. 프라다 스타일 (LG Prada Phone 2007 감성) — 블랙 글로시 + 역삼각 메탈 플레이트 */
    [data-icon-style="prada"] .icon-chip {
        background:linear-gradient(160deg,#242424 0%,#050505 65%); border:1px solid #3d3a35; border-radius:6px;
        box-shadow:inset 0 1px 0 rgba(255,255,255,0.09), 0 8px 16px -8px rgba(0,0,0,0.6);
    }
    [data-icon-style="prada"] .icon-chip .icon-svg { stroke:#f2ede6; stroke-width:1.4; }
    [data-icon-style="prada"] .icon-chip::after {
        content:''; position:absolute; top:-4px; right:-4px; width:0; height:0;
        border-left:4px solid transparent; border-right:4px solid transparent; border-top:6px solid #c7c2b8;
        filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));
    }

    main.content-area {
        flex: 1; min-width: 0;
        min-height: calc(100vh - 101px);
        background: var(--content-bg);
    }

    #contentInner { padding: 32px 40px; max-width: 1180px; }
    #contentFrame { width: 100%; border: none; display: block; }

    /* ===== Shared content styles ===== */
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .page-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }

    .card {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
        padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .stat-label { font-size: 11.5px; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; display:flex; align-items:center; justify-content:space-between; }
    .stat-value { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .stat-desc { font-size: 12px; color: var(--text-tertiary); }

    .pill { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; letter-spacing: .3px; }
    .pill-success { background: var(--success-soft); color: var(--success); }
    .pill-warning { background: var(--warning-soft); color: #b45309; }
    .pill-info { background: var(--info-soft); color: var(--info); }
    .pill-danger { background: var(--danger-soft); color: var(--danger); }

    .progress-track { width: 100%; height: 6px; background: #eef0f2; border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; background: var(--accent); }

    table.mini-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.mini-table th { text-align: left; padding: 8px 10px; font-size: 10.5px; text-transform: uppercase; color: var(--text-tertiary); border-bottom: 1px solid var(--border); }
    table.mini-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
    table.mini-table tr:last-child td { border-bottom: none; }

    .section-block { margin-top: 26px; }
    .section-block-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }

    .placeholder-box {
        border: 1px dashed var(--border); border-radius: 10px; padding: 40px 24px;
        text-align: center; color: var(--text-tertiary); background: #fcfcfd;
    }
    .placeholder-box .big-icon { font-size: 28px; margin-bottom: 10px; }
    .placeholder-box .title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .placeholder-box .desc { font-size: 12.5px; line-height: 1.6; max-width: 460px; margin: 0 auto; }

    .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .compare-table th, .compare-table td { border: 1px solid var(--border); padding: 12px 14px; text-align: left; }
    .compare-table th { background: #f8f9fa; font-size: 11.5px; text-transform: uppercase; color: var(--text-secondary); }
    .compare-table td.empty { color: var(--text-tertiary); font-style: italic; }
    .compare-table tr td:first-child { font-weight: 600; background: #fcfcfd; }

    .guest-banner {
        background: #fffbeb; color: #92400e; padding: 8px 24px; font-size: 12px;
        text-align: center; border-bottom: 1px solid #fde68a;
    }

    .error-box {
        background: var(--danger-soft); border: 1px solid #fecaca; border-radius: 10px; padding: 20px;
    }
    .error-box strong { color: #b91c1c; }
    .error-box p, .error-box ul { font-size: 13px; color: #991b1b; line-height: 1.7; }
    .error-box ul { margin-top: 8px; padding-left: 20px; }

    .launch-box {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
        padding: 32px 20px; max-width: 420px; margin: 40px auto;
    }
    .launch-box strong { color: var(--text); font-size: 15px; }
    .launch-box p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
    .launch-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 18px; border-radius: 8px; border: none;
        background: var(--accent); color: #fff; font-size: 13px; font-family: inherit;
        font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .launch-btn:hover { opacity: .88; }

    @media (max-width: 900px) {
        .sidebar { position: static; width: 100%; height: auto; }
        .app-body { flex-direction: column; align-items: stretch; }
        #contentInner { padding: 24px 20px; }
        main.content-area { width: 100%; }
    }
        @media (max-width: 480px) {
            header { padding-left: 14px; padding-right: 14px; height: auto; min-height: 56px; flex-wrap: wrap; row-gap: 8px; padding-top: 10px; padding-bottom: 10px; }
            #contentInner { padding-left: 14px; padding-right: 14px; }
            .brand-sub { display: none; }
            .user-area { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; }
        }
</style>
</head>

<div class="app-body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content-area">
        <div id="contentInner"></div>
        <iframe id="contentFrame" style="display:none;" title="section-content"></iframe>
    </main>
</div>

<script>
    // ===== Authentication Check =====
    const isEmbeddedPreview = (window.self !== window.top);
    let isGuestPreview = false;

    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
        if (isEmbeddedPreview) {
            isGuestPreview = true;
        } else {
            fetch('./index.html', { method: 'HEAD' })
                .then(res => {
                    if (res.ok) window.location.href = './index.html';
                    else { isGuestPreview = true; showGuestBanner(); }
                })
                .catch(() => { isGuestPreview = true; showGuestBanner(); });
        }
    }

    function showGuestBanner() {
        const banner = document.createElement('div');
        banner.className = 'guest-banner';
        banner.innerHTML = icon('triangle-alert') + ' 로그인 세션이 없어 <strong>미리보기(게스트) 모드</strong>로 표시 중입니다. 실제 사용 시 같은 폴더의 index.html에서 로그인해야 합니다.';
        document.body.insertBefore(banner, document.body.firstChild);
    }
    if (isEmbeddedPreview && sessionStorage.getItem('isLoggedIn') !== 'true') showGuestBanner();

    const username = sessionStorage.getItem('username') || ((isGuestPreview || isEmbeddedPreview) ? '게스트' : null);
    if (username) document.getElementById('username').textContent = username;

    const role = sessionStorage.getItem('role');
    const isAdmin = role === 'admin';
    if (isAdmin) document.getElementById('roleBadge').style.display = 'inline-block';

    // ===== Supabase 연동: 화면설정/도입평가 데이터를 전 기기·전 사용자 공유 =====
    // localStorage는 즉시 반영되는 로컬 캐시로 계속 사용하고, Supabase의 app_settings
    // 테이블(dash_ 접두어 키)이 실제 공유 저장소 역할을 합니다. 저장(쓰기)은 관리자만
    // 가능하며(admin_update_setting이 DB에서 권한을 검증), 조회(읽기)는 로그인 여부와
    // 무관하게 누구나 가능합니다(get_dashboard_settings).
    const myUsername = sessionStorage.getItem('username');
    const myPw = sessionStorage.getItem('pw');

    async function fetchDashboardSettings() {
        try {
            const sb = (typeof getSupabase === 'function') ? getSupabase() : null;
            if (!sb) return null;
            const { data, error } = await sb.rpc('get_dashboard_settings');
            if (error) throw error;
            return data || {};
        } catch (e) { console.warn('대시보드 공유 설정 조회 실패(로컬 값 사용):', e); return null; }
    }

    async function saveDashboardSetting(key, value) {
        try {
            const sb = (typeof getSupabase === 'function') ? getSupabase() : null;
            if (!sb || !myUsername || !myPw) return { success: false, message: '로그인 정보가 없습니다.' };
            const { data, error } = await sb.rpc('admin_update_setting', { p_admin_username: myUsername, p_admin_password: myPw, p_key: key, p_value: value });
            if (error) throw error;
            return data;
        } catch (e) { console.error('대시보드 공유 설정 저장 실패:', e); return { success: false, message: e.message }; }
    }

    async function syncFromCloud() {
        const remote = await fetchDashboardSettings();
        if (!remote) return; // Supabase 미연결/오류 시 로컬 캐시 값을 그대로 사용
        if (remote.dash_theme) applyTheme(remote.dash_theme);
        if (remote.dash_icon_style) applyIconStyle(remote.dash_icon_style);
        if (remote.dash_lang) { currentLang = remote.dash_lang; localStorage.setItem('dashLang', currentLang); }
        if (remote.dash_site_title !== undefined) localStorage.setItem('dashSiteTitle', remote.dash_site_title);
        if (remote.dash_site_subtitle !== undefined) localStorage.setItem('dashSiteSubtitle', remote.dash_site_subtitle);
        // 도입평가 사이드 메뉴를 동적으로 만들 때 쓰는 프로그램 목록도 시작할 때 최신화해둔다.
        if (remote.dash_eval_programs) localStorage.setItem('evalPrograms', remote.dash_eval_programs);
        renderHeaderTexts();
        renderCategoryBar();
        renderSidebar();
        renderContent();
    }

    function renderHeaderTexts() {
        document.getElementById('siteTitle').textContent = localStorage.getItem('dashSiteTitle') || 'JAEHO ERP Suite';
        document.getElementById('siteSubtitle').textContent = localStorage.getItem('dashSiteSubtitle') || L('ERP 도입 사전단계 통합 플랫폼', 'ERP Pre-Adoption Integration Platform');
        document.getElementById('settingsBtn').innerHTML = icon('settings') + ' ' + L('설정', 'Settings');
        document.getElementById('logoutBtn').textContent = L('로그아웃', 'Log out');
        document.getElementById('roleBadge').textContent = L('관리자', 'Admin');
    }

    function handleLogout() {
        if (confirm('로그아웃하시겠습니까?')) {
            ['isLoggedIn','username','loginTime','role','pw','loginCount'].forEach(k => sessionStorage.removeItem(k));
            window.location.href = './index.html';
        }
    }

    // ===== Theme system =====
    // A: 이그제큐티브 네이비&골드, B: 모던 엔터프라이즈 슬레이트, C: 컨설팅 클린(기본값)
    const THEMES = {
        A: {
            'header-bg': '#0b1830', 'header-text': '#f4ede0', 'header-border': '#0b1830', 'header-border-width': '1px',
            'header-btn-border': 'rgba(255,255,255,0.3)', 'header-btn-hover-bg': 'rgba(255,255,255,0.12)',
            'logo-bg': '#c9a227', 'logo-text': '#0b1830',
            'sidebar-bg': '#0f1e3a', 'sidebar-text': '#cbd3e1', 'sidebar-title': '#8894ac',
            'sidebar-hover-bg': 'rgba(255,255,255,0.06)', 'sidebar-active-bg': 'rgba(201,162,39,0.18)',
            'sidebar-active-text': '#e8c766', 'sidebar-active-border': '#c9a227',
            'accent': '#c9a227', 'cat-active-bg': 'rgba(201,162,39,0.14)', 'cat-active-text': '#a97f14',
            'content-bg': '#fbfaf7', 'card-bg': '#ffffff', 'border': '#eae4d6',
            'text': '#0b1830', 'text-secondary': '#6b6455', 'text-tertiary': '#8a8270',
        },
        B: {
            'header-bg': '#ffffff', 'header-text': '#1e293b', 'header-border': '#e2e8f0', 'header-border-width': '1px',
            'header-btn-border': '#e2e8f0', 'header-btn-hover-bg': '#f1f5f9',
            'logo-bg': '#2563eb', 'logo-text': '#ffffff',
            'sidebar-bg': '#0f172a', 'sidebar-text': '#94a3b8', 'sidebar-title': '#64748b',
            'sidebar-hover-bg': 'rgba(255,255,255,0.06)', 'sidebar-active-bg': 'rgba(37,99,235,0.2)',
            'sidebar-active-text': '#60a5fa', 'sidebar-active-border': '#2563eb',
            'accent': '#2563eb', 'cat-active-bg': '#eff6ff', 'cat-active-text': '#2563eb',
            'content-bg': '#f8fafc', 'card-bg': '#ffffff', 'border': '#e2e8f0',
            'text': '#0f172a', 'text-secondary': '#64748b', 'text-tertiary': '#94a3b8',
        },
        C: {
            'header-bg': '#ffffff', 'header-text': '#16324f', 'header-border': '#16324f', 'header-border-width': '2px',
            'header-btn-border': '#d7dee4', 'header-btn-hover-bg': '#f2f5f7',
            'logo-bg': '#16324f', 'logo-text': '#ffffff',
            'sidebar-bg': '#fbfcfd', 'sidebar-text': '#45566a', 'sidebar-title': '#93a2ae',
            'sidebar-hover-bg': '#f0f1f3', 'sidebar-active-bg': '#eef2f5',
            'sidebar-active-text': '#16324f', 'sidebar-active-border': '#b8860b',
            'accent': '#16324f', 'cat-active-bg': '#eef2f5', 'cat-active-text': '#16324f',
            'content-bg': '#ffffff', 'card-bg': '#ffffff', 'border': '#e6ebf0',
            'text': '#16324f', 'text-secondary': '#7a8896', 'text-tertiary': '#9aa7b3',
        },
    };

    function applyTheme(key) {
        const theme = THEMES[key] || THEMES.C;
        Object.entries(theme).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));
        localStorage.setItem('dashTheme', key);
    }
    applyTheme(localStorage.getItem('dashTheme') || 'C');

    // ===== Language system =====
    // 'ko' | 'en' | 'both' — 설정(settings.html)에서 바꾸면 localStorage로 공유됩니다.
    let currentLang = localStorage.getItem('dashLang') || 'ko';
    function L(ko, en) {
        if (currentLang === 'en') return en;
        if (currentLang === 'both') return ko + ' · ' + en;
        return ko;
    }

    // ===== Icon system (Lucide SVG sprite, see assets/icons/sprite.svg for source) =====
    function icon(name, cls) {
        if (!name) return '';
        return '<svg class="icon-svg' + (cls ? ' ' + cls : '') + '"><use href="#icon-' + name + '"></use></svg>';
    }
    // 칩(배경 박스)으로 감싸는 버전 — 사이드바 항목·큰 안내 아이콘처럼 자리가 넉넉한 곳에서만 사용.
    // hue를 넘기면 그 카테고리 색으로, 안 넘기면 시스템(무채색) 톤으로 렌더링됨.
    function iconChip(name, hue, sizeClass) {
        if (!name) return '';
        var hueAttr = hue ? ' data-hue="' + hue + '"' : '';
        var sizeCls = sizeClass ? ' ' + sizeClass : '';
        return '<span class="icon-chip' + sizeCls + '"' + hueAttr + '>' + icon(name) + '</span>';
    }

    // ===== 아이콘 스타일(설정 > 아이콘 스타일) — gradient | pastel | glass | minimal | prada =====
    function applyIconStyle(key) {
        var valid = ['gradient', 'pastel', 'glass', 'minimal', 'prada'];
        var k = valid.indexOf(key) !== -1 ? key : 'minimal';
        document.documentElement.setAttribute('data-icon-style', k);
        localStorage.setItem('dashIconStyle', k);
    }
    applyIconStyle(localStorage.getItem('dashIconStyle') || 'minimal');

    // ===== Menu data model =====
    // type: 'overview' | 'file' | 'placeholder'
    // 파일명 코드 규칙: 카테고리 A~G(대시보드~시스템) + 항목 순번(A,B,C...) = 두 자리 코드.
    // 실제 파일이 있는 항목은 "코드-원래이름.html"로 저장함 (예: FA-reports.html, 2026-09-23 FA-reports-1col.html에서 리네임).

    // ===== 도입평가(evaluation) 사이드 메뉴 동적 생성 =====
    // BA-evaluation.html(종합 비교)의 "evalPrograms" 데이터를 이 셸도 함께 읽어서,
    // BA에 프로그램 열이 추가/삭제/이름변경되면 사이드 메뉴도 자동으로 따라간다.
    // (contentFrame은 sandbox 없이 srcdoc으로 로드되므로 iframe과 이 셸은 같은 origin의
    //  localStorage를 실시간으로 공유한다 — BA 안에서 저장한 값이 바로 이 셸에서도 보인다.)
    function loadEvalProgramsForSidebar() {
        try {
            const raw = localStorage.getItem('evalPrograms');
            if (raw) return JSON.parse(raw);
        } catch (e) {}
        return [
            { id: 'inhouse', name: '자체 개발', icon: 'wrench' },
            { id: 'p1', name: '파일럿: 프로그램 1', icon: 'flask-conical' },
            { id: 'p2', name: '파일럿: 프로그램 2', icon: 'flask-conical' },
        ];
    }
    function getCategoryItems(cat) {
        if (cat.key !== 'evaluation') return cat.items;
        const programs = loadEvalProgramsForSidebar();
        const dynamicItems = programs.map(p => ({
            key: 'eval-' + p.id, code: 'BF', icon: p.icon || 'flask-conical',
            label: p.name || '(이름 없음)', labelEn: p.name || '(unnamed)',
            type: 'file', file: 'BF-eval-detail.html', pid: p.id,
        }));
        // 2026-09-22: 예전엔 BE~BJ(4개 사업군 파일럿)가 이 카테고리 끝에도 고정 배치돼 있어서
        // 하드코딩된 인덱스 목록으로 동적 프로그램을 그 "사이"에 끼워 넣어야 했고, 그 인덱스가
        // 실제 배열과 안 맞아 항목이 조용히 사라지는 버그가 실제로 있었다. 이제 BE~BJ는 별도
        // 'demo' 카테고리로 옮겨져서 이 카테고리엔 고정 항목(cat.items) 뒤에 동적 프로그램만
        // 이어 붙이면 되므로, 더는 인덱스를 손으로 맞출 필요가 없다.
        return [...cat.items, ...dynamicItems];
    }

    function findItem(catKey, itemKey) {
        const cat = CATEGORIES.find(c => c.key === catKey);
        if (!cat) return null;
        const item = getCategoryItems(cat).find(i => i.key === itemKey);
        if (!item) return null;
        return { cat, item };
    }

    let currentCategory = localStorage.getItem('dashCategory') || 'dashboard';
    let currentItem = localStorage.getItem('dashItem') || 'overview';
    if (!findItem(currentCategory, currentItem)) { currentCategory = 'dashboard'; currentItem = 'overview'; }

    function selectCategory(catKey) {
        const cat = CATEGORIES.find(c => c.key === catKey);
        if (!cat) return;
        const items = getCategoryItems(cat);
        const visibleItems = items.filter(i => !i.adminOnly || isAdmin);
        selectItem(catKey, (visibleItems[0] || items[0]).key);

        // 도입평가 탭을 열 때마다, 혹시 다른 기기/세션에서 방금 프로그램을
        // 추가/삭제했을 수 있으니 최신 목록을 한 번 더 확인해 사이드 메뉴를 갱신한다.
        if (catKey === 'evaluation') {
            fetchDashboardSettings().then(remote => {
                if (!remote || !remote.dash_eval_programs) return;
                if (remote.dash_eval_programs === localStorage.getItem('evalPrograms')) return;
                localStorage.setItem('evalPrograms', remote.dash_eval_programs);
                if (!findItem(currentCategory, currentItem)) {
                    selectCategory(currentCategory);
                } else {
                    renderSidebar();
                }
            });
        }
    }

    function selectItem(catKey, itemKey) {
        currentCategory = catKey;
        currentItem = itemKey;
        localStorage.setItem('dashCategory', catKey);
        localStorage.setItem('dashItem', itemKey);
        renderCategoryBar();
        renderSidebar();
        renderContent();
    }

    function renderCategoryBar() {
        const bar = document.getElementById('categoryBar');
        bar.innerHTML = CATEGORIES.map(cat => `
            <button class="cat-btn ${cat.key === currentCategory ? 'active' : ''}" data-cat="${cat.key}">
                ${icon(cat.icon)} ${L(cat.label, cat.labelEn)}
            </button>
        `).join('');
        bar.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => selectCategory(btn.dataset.cat));
        });
    }

    function renderSidebar() {
        const isOverview = currentCategory === 'dashboard' && currentItem === 'overview';
        const catsToShow = isOverview ? CATEGORIES : CATEGORIES.filter(c => c.key === currentCategory);
        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = catsToShow.map(cat => {
            const items = getCategoryItems(cat).filter(i => !i.adminOnly || isAdmin);
            return `
                <div class="sb-section">
                    <div class="sb-section-title">${icon(cat.icon)} ${L(cat.label, cat.labelEn)}</div>
                    <ul class="sb-menu">
                        ${items.map(i => `
                            <li>
                                <a href="#" data-cat="${cat.key}" data-item="${i.key}"
                                   class="${cat.key === currentCategory && i.key === currentItem ? 'active' : ''}">
                                    <span class="sb-icon">${iconChip(i.icon, cat.key, 'sb-icon-chip')}</span>${L(i.label, i.labelEn)}
                                </a>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
        }).join('');
        sidebar.querySelectorAll('.sb-menu a').forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                selectItem(a.dataset.cat, a.dataset.item);
            });
        });
    }

    const contentInner = document.getElementById('contentInner');
    const contentFrame = document.getElementById('contentFrame');

    contentFrame.addEventListener('load', () => {
        try {
            const doc = contentFrame.contentDocument;
            if (!doc || !doc.body) return;

            // users.html/settings.html처럼 class="navbar"가 아니라 그냥 <header>를
            // 쓰는 페이지도 있어서, 둘 다 찾아서 숨깁니다. 이 헤더 안에는 보통
            // "← 메뉴로" 같은 자체 링크가 들어있는데, 숨기지 않으면 그 링크를
            // 눌렀을 때 iframe "내부"에서 menu.html이 다시 통째로 열려서
            // 대시보드가 자기 자신 안에 중첩되어 계속 커지는 문제가 생깁니다.
            const innerNav = doc.querySelector('.navbar') || doc.querySelector('header');
            if (innerNav) innerNav.style.display = 'none';

            // users.html처럼 body/html에 min-height:100vh 같은 스타일이 있으면,
            // iframe 높이를 키울 때마다 100vh 기준값도 같이 커져서 다시 resize가
            // 발생하는 무한 루프(높이가 수십만 px까지 폭주)가 생길 수 있습니다.
            // 실제 콘텐츠 높이만 반영되도록 iframe 안에서 그 min-height을 무력화합니다.
            const styleOverride = doc.createElement('style');
            styleOverride.textContent = 'html, body { min-height: 0 !important; height: auto !important; }';
            doc.head.appendChild(styleOverride);

            const MAX_HEIGHT = 20000; // 만약을 위한 안전 상한선
            let lastHeight = 0;
            const resize = () => {
                // documentElement.scrollHeight는 항상 0보다 큰 값을 반환하기 때문에
                // (구 코드의 "documentElement || body" 순서에서는 body 쪽이 사실상 절대
                // 쓰이지 않았음), 실제 렌더링된 콘텐츠 높이를 더 정확히 반영하는
                // body 쪽 측정값을 우선 사용합니다. documentElement가 간헐적으로
                // body보다 훨씬 큰 값을 보고하는 경우가 실제로 관측되었습니다
                // (evaluation.html 검증 중 body=2074px인데 documentElement=3952px로
                //  측정되어 iframe 하단에 빈 여백이 남는 문제가 있었음).
                const bodyH = doc.body ? Math.max(doc.body.scrollHeight, doc.body.offsetHeight) : 0;
                const raw = bodyH || (doc.documentElement ? doc.documentElement.scrollHeight : 0);
                const h = Math.min(raw, MAX_HEIGHT);
                if (Math.abs(h - lastHeight) < 2) return; // 미세한 변화는 무시해 루프 방지
                lastHeight = h;
                contentFrame.style.height = (h + 20) + 'px';
            };
            resize();

            // users.html처럼 데이터를 비동기로 불러오거나(Supabase 등),
            // 탭 전환으로 내부 화면 높이가 바뀌는 페이지도 항상 잘리지 않도록
            // ResizeObserver로 iframe 내부 크기 변화를 계속 감지해서 자동으로 맞춥니다.
            if (contentFrame._resizeObserver) { contentFrame._resizeObserver.disconnect(); }
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => resize());
                ro.observe(doc.body);
                if (doc.documentElement) ro.observe(doc.documentElement);
                contentFrame._resizeObserver = ro;
            } else {
                setTimeout(resize, 200);
                setTimeout(resize, 600);
                setTimeout(resize, 1500);
                setTimeout(resize, 3000);
            }
        } catch (e) {
            console.warn('iframe 내부 접근 실패:', e);
        }
    });

    async function renderContent() {
        const found = findItem(currentCategory, currentItem);
        if (!found) return;
        const { cat, item } = found;

        if (item.type === 'external') {
            // Architect-LAB(tool1/index1.html)처럼 자체 뷰포트 전체를 차지하도록
            // 설계된 대형 단일 페이지 앱은 이 셸의 "콘텐츠 높이에 맞춰 iframe을
            // 자동 확장"하는 로직(윗쪽 contentFrame ResizeObserver)과 서로 되먹임
            // 루프를 일으켜 스크롤바가 무한정 길어지거나, 렌더링 초반 미스타일된
            // 원본 화면이 잠깐 노출되는 문제가 있었다(2026-09-22 사용자 리포트).
            // iframe으로 임베드하지 않고 새 탭으로 직접 열어 이 문제를 원천 차단한다.
            // 2026-09-22 추가 수정: 처음엔 사이드 메뉴를 클릭하는 순간 자동으로
            // window.open()까지 같이 호출했는데, 사용자가 "새 창 열기 버튼을 누를 때만
            // 열리게 해달라"고 요청 — 메뉴 클릭은 이 안내 카드만 보여주고, 새 탭은
            // 카드 안의 버튼을 직접 눌러야만 열리도록 분리함(자동 팝업 제거).
            contentFrame.style.display = 'none';
            contentFrame.srcdoc = '';
            contentInner.style.display = 'block';
            contentInner.innerHTML = `
                <div class="launch-box" style="text-align:center;">
                    <strong>${L(item.label, item.labelEn)}은(는) 새 창에서 열립니다.</strong>
                    <p>아래 버튼을 눌러 새 탭에서 열어주세요.</p>
                    <button class="launch-btn" onclick="window.open('${item.file}', '_blank')">${icon('puzzle')} ${L(item.label, item.labelEn)} 새 창에서 열기</button>
                </div>
            `;
            return;
        }

        if (item.type === 'file') {
            try {
                const res = await fetch(item.file, { cache: 'no-store' });
                if (res.ok) {
                    let html = await res.text();
                    // 도입평가의 동적 프로그램 항목(BF-eval-detail.html)처럼, 하나의 파일을
                    // 여러 사이드 메뉴 항목이 공유하는 경우 item.pid로 "어느 프로그램인지"를
                    // 알려준다. srcdoc은 주소창 URL이 없어 쿼리스트링을 못 쓰므로, 대신
                    // 파일 안에 window.__EVAL_PID__ 전역변수를 심어서 전달한다.
                    if (item.pid) {
                        const pidScript = '<script>window.__EVAL_PID__=' + JSON.stringify(item.pid) + ';<\/script>';
                        html = html.includes('<head>') ? html.replace('<head>', '<head>' + pidScript) : (pidScript + html);
                    }
                    contentInner.style.display = 'none';
                    contentFrame.style.display = 'block';
                    contentFrame.srcdoc = html;
                } else {
                    showInlineError(item.file, `응답 오류 (${res.status})`);
                }
            } catch (e) {
                showInlineError(item.file, e.message);
            }
            return;
        }

        contentFrame.style.display = 'none';
        contentFrame.srcdoc = '';
        contentInner.style.display = 'block';

        if (item.type === 'overview') { contentInner.innerHTML = overviewHTML(); return; }
        contentInner.innerHTML = placeholderHTML(cat, item);
    }

    function showInlineError(filePath, detail) {
        contentFrame.style.display = 'none';
        contentInner.style.display = 'block';
        const isFileProtocol = location.protocol === 'file:';
        contentInner.innerHTML = `
            <div class="error-box">
                <strong>"${filePath}" 파일을 불러오지 못했습니다.</strong>
                <p style="margin-top:8px;">원인: ${detail}</p>
                <ul>
                    <li>dashboard-master.html과 콘텐츠 파일들이 모두 같은 폴더에 있어야 합니다.</li>
                    ${isFileProtocol ? '<li>파일을 더블클릭해서 열면(file:// 주소) fetch가 차단됩니다. 로컬 서버(Live Server, python -m http.server 등)로 열어주세요.</li>' : ''}
                </ul>
            </div>
        `;
    }

    function placeholderHTML(cat, item) {
        return `
            <div class="page-title">${icon(item.icon)} ${L(item.label, item.labelEn)}</div>
            <div class="page-subtitle">${L(cat.label, cat.labelEn)} · ${L(item.label, item.labelEn)}</div>
            <div class="placeholder-box">
                <div class="big-icon">${iconChip('construction', cat.key, 'hero-icon-chip')}</div>
                <div class="title">${L('아직 준비 중인 화면입니다', 'This screen is not ready yet')}</div>
                <div class="desc">${L('이 자리는 나중에 실제 콘텐츠 파일로 교체될 예정입니다. 지금은 메뉴 구조만 먼저 확정해두는 단계입니다.', 'This placeholder will be replaced with real content later. For now, only the menu structure is being finalized.')}</div>
            </div>
        `;
    }

    // ===== 도입 평가 · 종합 비교 =====
    // 예전에는 이 셸 파일 안에 인라인으로 있었으나, 독립 모듈 파일(evaluation.html)로
    // 분리되어 다른 'file' 타입 항목(KPI, 사용자관리 등)과 동일하게 본문 영역에 로드됩니다.
    // 관련 로직(EVAL_CRITERIA, compareHTML 등)은 evaluation.html 안에 있습니다.

    function overviewHTML() {
        return `
            <div class="page-title">${icon('bar-chart-3')} ${L('ERP 구축 진행 현황', 'ERP Implementation Status')}</div>
            <div class="page-subtitle">${L('전사 ERP 도입 프로젝트의 전체 진행 상황을 한눈에 확인합니다.', 'A single view of the company-wide ERP adoption project status.')}</div>

            <div class="grid">
                <div class="card">
                    <div class="stat-label">${L('전체 진행률', 'Overall Progress')} <span class="pill pill-success">ON TRACK</span></div>
                    <div class="stat-value">68%</div>
                    <div class="progress-track"><div class="progress-fill" style="width:68%"></div></div>
                </div>
                <div class="card">
                    <div class="stat-label">${L('완료된 마일스톤', 'Milestones Done')} <span class="pill pill-success">60%</span></div>
                    <div class="stat-value">6/10</div>
                    <div class="stat-desc">${L('다음 마일스톤: 통합 테스트', 'Next milestone: Integration Testing')}</div>
                </div>
                <div class="card">
                    <div class="stat-label">${L('활성 리스크', 'Active Risks')} <span class="pill pill-warning">3 Active</span></div>
                    <div class="stat-value">3</div>
                    <div class="stat-desc">${L('1개 높은 위험도 (인력부족)', '1 high severity (staffing shortage)')}</div>
                </div>
                <div class="card">
                    <div class="stat-label">${L('예산 소진', 'Budget Used')} <span class="pill pill-success">85%</span></div>
                    <div class="stat-value">85%</div>
                    <div class="progress-track"><div class="progress-fill" style="width:85%"></div></div>
                </div>
                <div class="card">
                    <div class="stat-label">${L('팀 참여도', 'Team Engagement')} <span class="pill pill-info">8/8</span></div>
                    <div class="stat-value">8</div>
                    <div class="stat-desc">${L('IT, 영업, 회계, 인사, 창고...', 'IT, Sales, Finance, HR, Warehouse...')}</div>
                </div>
                <div class="card">
                    <div class="stat-label">${L('최근 업데이트', 'Recent Updates')} <span class="pill pill-info">2${L('건', '')}</span></div>
                    <div class="stat-value" style="font-size:15px;">2025-09-16</div>
                    <div class="stat-desc">${L('데이터 검증 완료 · 설정 최적화 진행중', 'Data validation done · Config tuning in progress')}</div>
                </div>
            </div>

            <div class="section-block">
                <div class="section-block-title">${icon('rocket')} ${L('주요 마일스톤', 'Key Milestones')}</div>
                <div class="card">
                    <table class="mini-table">
                        <thead><tr><th>Phase</th><th>${L('기간', 'Duration')}</th><th>${L('상태', 'Status')}</th></tr></thead>
                        <tbody>
                            <tr><td>${L('Phase 1: 요구사항 분석', 'Phase 1: Requirements Analysis')}</td><td>2025-06-15 → 2025-07-30</td><td><span class="pill pill-success">${L('완료', 'Done')}</span></td></tr>
                            <tr><td>${L('Phase 2: 시스템 설계', 'Phase 2: System Design')}</td><td>2025-08-01 → 2025-09-10</td><td><span class="pill pill-success">${L('완료', 'Done')}</span></td></tr>
                            <tr><td>${L('Phase 3: 개발 및 구축', 'Phase 3: Development & Build')}</td><td>2025-09-12 → 2025-12-20</td><td><span class="pill pill-info">${L('진행중 68%', 'In Progress 68%')}</span></td></tr>
                            <tr><td>${L('Phase 4: 테스트 및 검증', 'Phase 4: Testing & Validation')}</td><td>2025-12-15 → 2026-01-31</td><td><span class="pill pill-warning">${L('예정', 'Upcoming')}</span></td></tr>
                            <tr><td>${L('Phase 5: 운영 개시 및 안정화', 'Phase 5: Go-live & Stabilization')}</td><td>2026-02-01 → 2026-03-31</td><td><span class="pill pill-warning">${L('예정', 'Upcoming')}</span></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="section-block">
                <div class="section-block-title">${icon('newspaper')} ${L('최근 리포트', 'Recent Reports')}</div>
                <div class="card">
                    <table class="mini-table">
                        <thead><tr><th>${L('날짜', 'Date')}</th><th>${L('제목', 'Title')}</th><th>${L('타입', 'Type')}</th></tr></thead>
                        <tbody>
                            <tr><td>2025-09-16</td><td>${L('주간 진행현황 (9월 3주차)', 'Weekly Status (Sep Wk3)')}</td><td><span class="pill pill-info">${L('주간보고', 'Weekly')}</span></td></tr>
                            <tr><td>2025-09-10</td><td>${L('[리스크] 개발 인력 일정 재조정', '[Risk] Dev staffing schedule adjusted')}</td><td><span class="pill pill-warning">${L('리스크', 'Risk')}</span></td></tr>
                            <tr><td>2025-09-08</td><td>${L('설계 최종 승인 결과 공지', 'Design final approval notice')}</td><td><span class="pill pill-success">${L('승인', 'Approved')}</span></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    // ===== Init =====
    renderHeaderTexts();
    renderCategoryBar();
    renderSidebar();
    renderContent();
    syncFromCloud(); // 로컬 캐시로 먼저 즉시 렌더한 뒤, Supabase의 공유 값으로 갱신합니다.

    // settings.html에서 테마/언어를 바꾸고 이 탭으로 돌아왔을 때(다른 탭에서 localStorage가 바뀐 경우)
    // 새로고침 없이 즉시 반영되도록 감지합니다.
    window.addEventListener('storage', (e) => {
        if (e.key === 'dashTheme') applyTheme(e.newValue || 'C');
        if (e.key === 'dashIconStyle') applyIconStyle(e.newValue || 'minimal');
        if (e.key === 'dashLang') {
            currentLang = e.newValue || 'ko';
            renderHeaderTexts();
            renderCategoryBar();
            renderSidebar();
            renderContent();
        }
        if (e.key === 'dashSiteTitle' || e.key === 'dashSiteSubtitle') renderHeaderTexts();
    });
</script>
