<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect-LAB - 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #534AB7 0%, #6366f1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #534AB7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            font-weight: 700;
            color: white;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .logo-desc {
            font-size: 13px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #534AB7;
            box-shadow: 0 0 0 3px rgba(83, 74, 183, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #534AB7 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(83, 74, 183, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #e53e3e;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            min-height: 18px;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #534AB7;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 12px;
            color: #534AB7;
            line-height: 1.5;
        }

        .info-box strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">A</div>
            <div class="logo-text">Architect-LAB</div>
            <div class="logo-desc">ERP Architecture Design Tool</div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="userId">아이디</label>
                <input 
                    type="text" 
                    id="userId" 
                    placeholder="아이디 입력" 
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="userPassword">비밀번호</label>
                <input 
                    type="password" 
                    id="userPassword" 
                    placeholder="비밀번호 입력" 
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="login-btn">로그인</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="info-box">
            <strong>테스트 계정</strong>
            아이디: <code>재호 계정</code><br>
            비번: <code>재호 패스워드</code>
        </div>
    </div>

    <script>
        // ──────────────────────────────────────
        // 로그인 계정 관리 (하드코딩)
        // ──────────────────────────────────────
        const VALID_ACCOUNTS = {
            'jaeho': '1234321',
            'admin': 'admin123',
            'test': 'test123'
        };

        function handleLogin(event) {
            event.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const userPassword = document.getElementById('userPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            // 입력값 검증
            if (!userId || !userPassword) {
                errorMsg.textContent = '아이디와 비밀번호를 입력해주세요.';
                return;
            }

            // 계정 검증
            if (VALID_ACCOUNTS[userId] && VALID_ACCOUNTS[userId] === userPassword) {
                // 로그인 성공
                errorMsg.textContent = '';
                
                // 로그인 상태 저장 (sessionStorage 사용 - 브라우저 종료 시 삭제)
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', userId);
                sessionStorage.setItem('loginTime', new Date().toISOString());
                
                // menu.html로 리다이렉트
                setTimeout(() => {
                    window.location.href = './menu.html';
                }, 300);
            } else {
                // 로그인 실패
                errorMsg.textContent = '아이디 또는 비밀번호가 일치하지 않습니다.';
                document.getElementById('userPassword').value = '';
                document.getElementById('userPassword').focus();
            }
        }

        // 엔터 키로 로그인 (자동)
        document.getElementById('userPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // 이미 로그인한 상태면 menu.html로 자동 리다이렉트
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = './menu.html';
        }
    </script>
</body>
</html>
